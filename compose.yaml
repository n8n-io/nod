name: nod-local
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: nod
      POSTGRES_PASSWORD: ${NOD_POSTGRES_PASSWORD:?Run npm run dev to prepare the local database}
      POSTGRES_DB: nod
    ports:
      - '127.0.0.1:54329:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U nod']
      interval: 2s
      timeout: 3s
      retries: 30
  browser:
    build:
      context: .
      dockerfile: Dockerfile.browser
    container_name: nod-browser
    hostname: nod-browser
    init: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    read_only: true
    pids_limit: 4096
    mem_limit: 8g
    cpus: 6
    shm_size: 1g
    volumes:
      - browser-data:/data
    tmpfs:
      - /tmp:size=1g
      - /home/node:uid=1000,gid=1000,mode=700,size=256m
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          'const s=require("node:net").connect("/data/control.sock");s.on("connect",()=>{s.end();process.exit(0)});s.on("error",()=>process.exit(1))',
        ]
      interval: 2s
      timeout: 3s
      retries: 30
  workspace:
    build:
      context: .
      dockerfile: Dockerfile.workspace
    container_name: nod-workspace
    init: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 4096
    mem_limit: 8g
    cpus: 4
    volumes:
      - ${NOD_DATA_ROOT:-./.local}/workspaces:/workspace
      - workspace-tools:/home/node
    command: ['sleep', 'infinity']
volumes:
  postgres-data:
  workspace-tools:
  browser-data:
