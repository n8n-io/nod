<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#fafafa" />
    <meta name="referrer" content="no-referrer" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="alternate icon" href="/favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <script src="/theme-init.js"></script>
    <title>Nod</title>
    <style>
      .startup-shell {
        visibility: hidden;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="app-shell startup-shell">
        <aside class="sidebar" aria-hidden="true" inert>
          <span class="brand"
            ><span class="brand-glyph" aria-hidden="true"
              ><svg viewBox="0 0 32 32" width="30" height="30" fill="none">
                <circle cx="16" cy="16" r="10" stroke="currentColor" stroke-width="4" />
                <circle cx="25" cy="6" r="4" fill="#ff91ac" /></svg></span
            ><span>Nod</span></span
          >
          <nav class="main-nav">
            <ul>
              <li>
                <span class="nav-link"
                  ><span class="skeleton ghost-nav-icon"></span
                  ><span class="nav-label">Chat</span></span
                >
              </li>
              <li>
                <span class="nav-link"
                  ><span class="skeleton ghost-nav-icon"></span
                  ><span class="nav-label">Tasks</span></span
                >
              </li>
              <li>
                <span class="nav-link"
                  ><span class="skeleton ghost-nav-icon"></span
                  ><span class="nav-label">Schedule</span></span
                >
              </li>
              <li>
                <span class="nav-link"
                  ><span class="skeleton ghost-nav-icon"></span
                  ><span class="nav-label">Apps</span></span
                >
              </li>
              <li>
                <span class="nav-link"
                  ><span class="skeleton ghost-nav-icon"></span
                  ><span class="nav-label">Channels</span></span
                >
              </li>
              <li>
                <span class="nav-link"
                  ><span class="skeleton ghost-nav-icon"></span
                  ><span class="nav-label">Vault</span></span
                >
              </li>
            </ul>
          </nav>
          <div class="mobile-top-bar">
            <span class="mobile-chat-link"
              ><span class="brand-glyph" aria-hidden="true"
                ><svg viewBox="0 0 32 32" width="30" height="30" fill="none">
                  <circle cx="16" cy="16" r="10" stroke="currentColor" stroke-width="4" />
                  <circle cx="25" cy="6" r="4" fill="#ff91ac" /></svg></span
            ></span>
            <span class="mobile-menu-trigger"><span class="skeleton ghost-avatar"></span></span>
          </div>
          <div class="sidebar-bottom">
            <span class="nav-link"
              ><span class="skeleton ghost-nav-icon"></span
              ><span class="skeleton ghost-nav-label"></span
            ></span>
            <span class="nav-link"
              ><span class="skeleton ghost-nav-icon"></span
              ><span class="skeleton ghost-nav-label"></span
            ></span>
            <span class="skeleton ghost-account"></span>
          </div>
        </aside>
        <div class="workspace-frame">
          <div class="workspace-body">
            <main class="main-workspace">
              <div class="chat-page chat-skeleton" aria-busy="true">
                <div class="conversation-scroll"></div>
                <div class="chat-bottom conversation-column">
                  <p class="skeleton-note" role="status">
                    <span class="sr-only">Opening Nod…</span>
                  </p>
                  <div class="composer ghost-composer" aria-hidden="true">
                    <p>Message Nod…</p>
                    <div class="composer-tools">
                      <div class="composer-left">
                        <span class="button button-ghost button-icon"
                          ><svg
                            viewBox="0 0 24 24"
                            width="16"
                            height="16"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="2"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                          >
                            <path d="M13.234 20.252 21 12.3" />
                            <path
                              d="m16 6-8.414 8.586a2 2 0 0 0 0 2.828 2 2 0 0 0 2.828 0l8.414-8.586a4 4 0 0 0 0-5.656 4 4 0 0 0-5.656 0l-8.415 8.585a6 6 0 1 0 8.486 8.486"
                            /></svg
                        ></span>
                      </div>
                      <span class="button button-icon send-button ghost-send"
                        ><svg
                          viewBox="0 0 24 24"
                          width="19"
                          height="19"
                          fill="none"
                          stroke="currentColor"
                          stroke-width="2"
                          stroke-linecap="round"
                          stroke-linejoin="round"
                        >
                          <path d="m5 12 7-7 7 7" />
                          <path d="M12 19V5" /></svg
                      ></span>
                    </div>
                  </div>
                </div>
              </div>
            </main>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/web/main.tsx"></script>
  </body>
</html>
