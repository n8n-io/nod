<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="referrer" content="no-referrer" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script src="/theme-init.js"></script>
    <title>Return to Nod</title>
    <style>
      @font-face {
        font-family: 'Geist';
        src: url('/fonts/Geist-Variable.woff2') format('woff2');
        font-weight: 100 900;
        font-style: normal;
        font-display: swap;
      }
      :root {
        background: #fafafa;
        color: #191919;
        --muted: #676767;
        --surface: #fff;
        --border: #e0e0e0;
        --focus: #87003c;
      }
      :root[data-theme='dark'] {
        background: #191919;
        color: #fafafa;
        --muted: #bfbfbf;
        --surface: #242424;
        --border: #353535;
        --focus: #ff91ac;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 16px;
        font-feature-settings: 'liga' 1;
        font:
          16px/1.6 'Geist',
          -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      main {
        width: min(100%, 440px);
        padding: 28px;
        text-align: center;
      }
      .brand {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        margin-bottom: 28px;
        font-size: 20px;
        font-weight: 500;
      }
      .brand svg {
        width: 28px;
        height: 28px;
      }
      h1 {
        margin: 0;
        font-size: 24px;
        font-weight: 500;
        line-height: 1.3;
        letter-spacing: -0.6px;
        overflow-wrap: anywhere;
      }
      p {
        margin: 8px 0 0;
        color: var(--muted);
        font-size: 14px;
      }
      .actions {
        display: flex;
        justify-content: center;
        margin-top: 28px;
      }
      .return {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        min-height: 44px;
        padding: 10px 20px;
        border-radius: 999px;
        background: #ff91ac;
        color: #191919;
        font-size: 14px;
        font-weight: 500;
        text-decoration: none;
        border: 0;
        font-family: inherit;
        cursor: pointer;
      }
      .return:hover {
        background: #ffd0d9;
      }
      [hidden] {
        display: none !important;
      }
      .return:focus-visible {
        outline: 2px solid var(--focus);
        outline-offset: 4px;
      }
      @media (max-width: 420px) {
        main {
          padding: 24px;
        }
        .return {
          width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <main aria-labelledby="title">
      <div class="brand">
        <svg viewBox="0 0 32 32" fill="none" aria-hidden="true">
          <circle cx="16" cy="16" r="10" stroke="currentColor" stroke-width="4" />
          <circle cx="25" cy="6" r="4" fill="#ff91ac" />
        </svg>
        <span>Nod</span>
      </div>
      <h1 id="title">Return to Nod</h1>
      <p id="message">Check your connection in Nod.</p>
      <div class="actions">
        <a id="return" class="return" href="/apps">Return to Nod</a>
      </div>
    </main>
    <script>
      (() => {
        const query = new URLSearchParams(window.location.search);
        const result = query.get('connection');
        const service = /^(?:[a-z][a-z0-9_]{0,79}|[a-z][a-z0-9-]{1,39})$/.test(
          query.get('service') ?? '',
        )
          ? query.get('service')
          : null;
        const connection = ['connected', 'continued', 'cancelled', 'failed', 'expired'].includes(
          result,
        )
          ? result
          : 'failed';
        const attempt = query.get('attempt');
        const succeeded = connection === 'connected' || connection === 'continued';
        const suppliedName = query.get('serviceName')?.trim();
        const name =
          suppliedName && suppliedName.length <= 200 && !/[\x00-\x1f\x7f]/.test(suppliedName)
            ? suppliedName
            : service?.replaceAll('_', ' ').replaceAll('-', ' ');
        const title = succeeded
          ? name
            ? `${name} is connected`
            : 'Your app is connected'
          : connection === 'cancelled'
            ? 'Sign-in cancelled'
            : connection === 'expired'
              ? 'Sign-in link no longer active'
              : 'Sign-in didn’t finish';
        document.getElementById('title').textContent = title;
        const message = document.getElementById('message');
        message.hidden = succeeded;
        if (!succeeded)
          message.textContent =
            connection === 'expired'
              ? 'Check your connection in Nod.'
              : connection === 'cancelled'
                ? 'You can start again in Nod.'
                : 'Try again in Nod.';
        const desktop = query.get('desktop') === '1';
        const returnLink = document.getElementById('return');
        returnLink.href = desktop ? 'nod://open/apps' : '/apps';
        returnLink.addEventListener('click', (event) => {
          if (
            desktop ||
            event.button !== 0 ||
            event.metaKey ||
            event.ctrlKey ||
            event.shiftKey ||
            event.altKey
          )
            return;
          try {
            window.close();
          } catch {}
        });
        document.title = `${title} · Nod`;
        try {
          history.replaceState(null, '', location.pathname);
        } catch {}
        try {
          if (attempt && /^[A-Za-z0-9_-]{43}$/.test(attempt)) {
            const channel = new BroadcastChannel('nod.apps');
            channel.postMessage({ connection, service, attempt });
            channel.close();
          }
        } catch {}
        if (succeeded) window.close();
      })();
    </script>
  </body>
</html>
