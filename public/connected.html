<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="referrer" content="no-referrer" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script src="/theme-init.js"></script>
    <title>Otto</title>
    <style>
      @font-face {
        font-family: 'Inter';
        src: url('/fonts/InterVariable.woff2') format('woff2');
        font-weight: 100 900;
        font-display: swap;
      }
      :root {
        background: #fdfcfe;
        color: #211c28;
      }
      :root[data-theme='dark'] {
        background: #1e1b21;
        color: #f5f1f6;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 24px;
        box-sizing: border-box;
        text-align: center;
        font:
          15px/1.6 'Inter',
          -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          sans-serif;
      }
    </style>
  </head>
  <body>
    <p>You can close this window and return to Otto.</p>
    <script>
      (() => {
        const query = new URLSearchParams(window.location.search);
        const result = query.get('connection');
        const service = /^[a-z]{1,40}$/.test(query.get('service') ?? '')
          ? query.get('service')
          : null;
        const connection = ['connected', 'continued', 'cancelled', 'failed', 'expired'].includes(
          result,
        )
          ? result
          : 'failed';
        const attempt = query.get('attempt');
        try {
          if (attempt && /^[A-Za-z0-9_-]{43}$/.test(attempt)) {
            const channel = new BroadcastChannel('otto.apps');
            channel.postMessage({ connection, service, attempt });
            channel.close();
          }
        } catch {}
        window.close();
      })();
    </script>
  </body>
</html>
