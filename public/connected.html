<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="referrer" content="no-referrer" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script src="/theme-init.js"></script>
    <title>Return to Otto</title>
    <style>
      @font-face {
        font-family: 'Geist';
        src: url('/fonts/Geist-Variable.woff2') format('woff2');
        font-weight: 100 900;
        font-style: normal;
        font-display: swap;
      }
      :root {
        background: #fafafa;
        color: #191919;
        --muted: #676767;
      }
      :root[data-theme='dark'] {
        background: #191919;
        color: #fafafa;
        --muted: #bfbfbf;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 24px;
        text-align: center;
        font-feature-settings: 'liga' 1;
        font:
          16px/1.6 'Geist',
          -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      main {
        width: min(100%, 420px);
      }
      .brand {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        margin-bottom: 36px;
        font-size: 28px;
        font-weight: 500;
      }
      .brand svg {
        width: 36px;
        height: 36px;
      }
      h1 {
        margin: 0 0 12px;
        font-size: 28px;
        font-weight: 500;
        line-height: 1.2;
      }
      p {
        margin: 0;
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <main aria-labelledby="title">
      <div class="brand">
        <svg viewBox="0 0 32 32" fill="none" aria-hidden="true">
          <circle cx="16" cy="16" r="10" stroke="currentColor" stroke-width="4" />
          <circle cx="25" cy="6" r="4" fill="#ff91ac" />
        </svg>
        <span>otto</span>
      </div>
      <h1 id="title">Return to Otto</h1>
      <p id="message">You can close this window and return to Otto.</p>
    </main>
    <script>
      (() => {
        const query = new URLSearchParams(window.location.search);
        const result = query.get('connection');
        const service = /^(?:[a-z][a-z0-9_]{0,79}|[a-z][a-z0-9-]{1,39})$/.test(
          query.get('service') ?? '',
        )
          ? query.get('service')
          : null;
        const connection = ['connected', 'continued', 'cancelled', 'failed', 'expired'].includes(
          result,
        )
          ? result
          : 'failed';
        const attempt = query.get('attempt');
        const succeeded = connection === 'connected' || connection === 'continued';
        const title = succeeded
          ? 'Your app is connected'
          : connection === 'cancelled'
            ? 'Sign-in cancelled'
            : connection === 'expired'
              ? 'Sign-in link expired'
              : 'Sign-in didn’t finish';
        document.getElementById('title').textContent = title;
        document.getElementById('message').textContent = succeeded
          ? 'You can close this window and return to Otto.'
          : 'Return to Otto and try connecting again.';
        document.title = `${title} · Otto`;
        try {
          history.replaceState(null, '', location.pathname);
        } catch {}
        try {
          if (attempt && /^[A-Za-z0-9_-]{43}$/.test(attempt)) {
            const channel = new BroadcastChannel('otto.apps');
            channel.postMessage({ connection, service, attempt });
            channel.close();
          }
        } catch {}
        window.close();
      })();
    </script>
  </body>
</html>
