<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="referrer" content="no-referrer" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'"
    />
    <title>Opening Google · Nod</title>
    <style>
      :root {
        color-scheme: light dark;
        background: #fafafa;
        color: #191919;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        font:
          16px/1.5 system-ui,
          sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      main {
        padding: 32px;
        text-align: center;
      }
      svg {
        width: 48px;
        height: 48px;
      }
      h1 {
        margin: 23px 0 0;
        font-size: 21px;
        font-weight: 550;
        letter-spacing: -0.4px;
      }
      .progress {
        display: block;
        box-sizing: border-box;
        width: 21px;
        height: 21px;
        margin: 22px auto 0;
        border: 2px solid #e0e0e0;
        border-top-color: #87003c;
        border-radius: 50%;
        animation: spin 1s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .progress {
          animation: none;
          border-style: dotted;
        }
      }
      @media (prefers-color-scheme: dark) {
        :root {
          background: #191919;
          color: #fafafa;
        }
        .progress {
          border-color: #464646;
          border-top-color: #ff91ac;
        }
      }
    </style>
  </head>
  <body>
    <main aria-labelledby="title">
      <svg viewBox="0 0 32 32" fill="none" aria-hidden="true">
        <circle cx="16" cy="16" r="10" stroke="currentColor" stroke-width="4" />
        <circle cx="25" cy="6" r="4" fill="#ff91ac" />
      </svg>
      <h1 id="title" role="status">Opening Google…</h1>
      <div class="progress" aria-hidden="true"></div>
    </main>
    <script src="/connection-loading.js"></script>
  </body>
</html>
