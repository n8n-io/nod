name: Docs

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'public/fonts/n8nBaumer*'
      - '.github/workflows/docs.yml'
  pull_request:
    paths:
      - 'docs/**'
      - 'public/fonts/n8nBaumer*'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build the docs and check links
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 10
    steps:
      - name: Check out source with history for page dates
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
      - name: Set up Node.js 24.21.0
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.21.0'
          cache: pnpm
          cache-dependency-path: docs/pnpm-lock.yaml
      - name: Install locked docs dependencies
        run: pnpm --dir docs install --frozen-lockfile
      - name: Build the site and validate every internal link
        env:
          DOCS_BASE: /
        run: pnpm --dir docs build
      - name: Upload the built site
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: otto-docs
          path: docs/dist
          retention-days: 7
