name: Docs

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'public/fonts/Geist*'
      - 'public/logos/**'
      - 'src/shared/app-links.ts'
      - 'src/shared/app-pages.json'
      - '.github/workflows/docs.yml'
  pull_request:
    paths:
      - 'docs/**'
      - 'public/fonts/Geist*'
      - 'public/logos/**'
      - 'src/shared/app-links.ts'
      - 'src/shared/app-pages.json'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build the site and check links
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 10
    steps:
      - name: Check out source with history for page dates
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115
      - name: Set up Node.js 24.21.0
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24.21.0'
          cache: pnpm
          cache-dependency-path: docs/pnpm-lock.yaml
      - name: Install locked docs dependencies
        run: pnpm --dir docs install --frozen-lockfile
      - name: Build the docs under /docs/ and validate every internal link
        run: pnpm --dir docs build
      - name: Put the landing page, site settings and disclosure file at the root
        run: |
          mkdir site
          cp -R docs/dist site/docs
          cp site/docs/next/index.html site/index.html
          cp site/docs/404.html site/404.html
          cp site/docs/favicon.ico site/favicon.ico
          cp site/docs/robots.txt site/robots.txt
          cp site/docs/_headers site/_headers
          cp -R site/docs/.well-known site/.well-known
          cp site/.well-known/security.txt site/security.txt
      - name: Upload the built site
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: nod-site
          path: site
          include-hidden-files: true
          retention-days: 7

  deploy:
    name: Deploy to nod.n8n.io
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 5
    environment:
      name: nod-n8n
      url: https://nod.n8n.io
    steps:
      - name: Set up Node.js 24.21.0
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24.21.0'
      - name: Download the built site
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: nod-site
          path: site
      - name: Deploy to the nod-n8n Cloudflare Pages project
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.152.0 pages deploy site --project-name nod-n8n --branch main --commit-hash "$GITHUB_SHA"
