name: Self-host bundle

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/self-host-bundle.yml'
      - '.github/scripts/server-release.mjs'
      - 'desktop/test/runtime-assets.test.mjs'
      - 'deployment/self-host/**'
      - 'Dockerfile.browser'
      - 'Dockerfile.workspace'
      - '.dockerignore'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'tsconfig.json'
      - 'patches/**'
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'vite.config.ts'
  pull_request:
    paths:
      - '.github/workflows/self-host-bundle.yml'
      - '.github/scripts/server-release.mjs'
      - 'desktop/test/runtime-assets.test.mjs'
      - 'deployment/self-host/**'
      - 'Dockerfile.browser'
      - 'Dockerfile.workspace'
      - '.dockerignore'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'tsconfig.json'
      - 'patches/**'
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'vite.config.ts'
  workflow_dispatch:
    inputs:
      draft_release:
        description: Prepare a private draft release from tested main after both architectures pass
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: self-host-bundle-${{ github.workflow }}-${{ github.ref }}-${{ inputs.draft_release && 'release' || 'build' }}
  cancel-in-progress: ${{ !inputs.draft_release }}

jobs:
  bundle:
    name: Validate and bundle Linux ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: blacksmith-16vcpu-ubuntu-2404
          - arch: arm64
            runner: blacksmith-16vcpu-ubuntu-2404-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      NOD_IMAGE_TAG: ${{ github.sha }}
    steps:
      - name: Check out the source revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24.21.0'
          cache: pnpm
      - name: Install packaging dependencies
        run: pnpm install --frozen-lockfile
      - name: Check release integrity and refusal paths
        run: node --test --test-name-pattern='server (release|bundle)' desktop/test/runtime-assets.test.mjs
      - name: Set up Docker build cache
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - name: Exercise a checkout with private file permissions
        run: chmod 600 package.json
      - name: Build the server image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          file: deployment/self-host/Dockerfile
          platforms: linux/${{ matrix.arch }}
          load: true
          tags: nod-server:${{ github.sha }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=self-host-server-${{ matrix.arch }}
          cache-to: type=gha,scope=self-host-server-${{ matrix.arch }},mode=max
      - name: Build the browser image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          file: Dockerfile.browser
          platforms: linux/${{ matrix.arch }}
          load: true
          tags: nod-browser:${{ github.sha }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=self-host-browser-${{ matrix.arch }}
          cache-to: type=gha,scope=self-host-browser-${{ matrix.arch }},mode=max
      - name: Build the workspace image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          file: Dockerfile.workspace
          platforms: linux/${{ matrix.arch }}
          load: true
          tags: nod-workspace:${{ github.sha }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=self-host-workspace-${{ matrix.arch }}
          cache-to: type=gha,scope=self-host-workspace-${{ matrix.arch }},mode=max
      - name: Validate the native stack
        run: node deployment/self-host/check.mjs
      - name: Package the tested images
        run: node deployment/self-host/bundle.mjs .local/server-bundles
      - name: Validate the standalone installer
        run: node deployment/self-host/check.mjs .local/server-bundles/nod-server-linux-${{ matrix.arch }}
      - name: Upload the private bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: nod-server-linux-${{ matrix.arch }}-${{ github.sha }}
          path: |
            .local/server-bundles/*.tar.gz
            .local/server-bundles/*.sha256
          compression-level: 0
          retention-days: 14
          include-hidden-files: true
          if-no-files-found: error

  release:
    name: Prepare private server release
    needs: bundle
    if: github.event_name == 'workflow_dispatch' && inputs.draft_release && github.ref == 'refs/heads/main' && github.event.repository.private
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 30
    environment: release
    permissions:
      contents: write
    steps:
      - name: Check out the tested revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24.21.0'
      - name: Download the tested AMD64 bundle
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: nod-server-linux-amd64-${{ github.sha }}
          path: .local/server-release
      - name: Download the tested ARM64 bundle
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: nod-server-linux-arm64-${{ github.sha }}
          path: .local/server-release
      - name: Verify source and uploaded digests, then leave the release as a draft
        env:
          GH_TOKEN: ${{ github.token }}
          NOD_DRAFT_RELEASE: ${{ inputs.draft_release }}
        run: node .github/scripts/server-release.mjs .local/server-release
