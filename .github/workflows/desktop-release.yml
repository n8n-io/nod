name: Build desktop release

on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]
  workflow_dispatch:
    inputs:
      automatic:
        description: Select the next patch from tested main without a release metadata PR
        type: boolean
        default: false
      publish:
        description: Publish one checked Otto release with all three installers
        type: boolean
        default: false

permissions:
  contents: read
  pull-requests: read

env:
  OTTO_RELEASE_SOURCE: ${{ github.event.workflow_run.head_sha || github.sha }}

concurrency:
  group: desktop-build-release
  cancel-in-progress: false
  queue: max

jobs:
  plan:
    name: Check release prerequisites
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
        (github.event.workflow_run.conclusion == 'success' &&
         github.event.workflow_run.head_repository.full_name == github.repository &&
         (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch')))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment:
      name: release
      deployment: false
    env:
      OTTO_RELEASE_TARGETS: all
      OTTO_SIGNING_MODE: ${{ vars.OTTO_SIGNING_MODE || 'self-signed' }}
    permissions:
      contents: write
      actions: read
      pull-requests: read
    outputs:
      release_needed: ${{ steps.plan.outputs.release_needed }}
      mac_matrix: ${{ steps.plan.outputs.mac_matrix }}
      runtime_matrix: ${{ steps.plan.outputs.runtime_matrix }}
      runtime_needed: ${{ steps.plan.outputs.runtime_needed }}
      metadata_sha256: ${{ steps.plan.outputs.metadata_sha256 }}
      source: ${{ steps.plan.outputs.source }}
      version: ${{ steps.plan.outputs.version }}
      previous_tag: ${{ steps.plan.outputs.previous_tag }}
      runtime_tag: ${{ steps.plan.outputs.runtime_tag }}
      runtime_fingerprint: ${{ steps.plan.outputs.runtime_fingerprint }}
      runtime_base_url: ${{ steps.plan.outputs.runtime_base_url }}
      runtime_reused: ${{ steps.plan.outputs.runtime_reused }}
      runtime_public: ${{ steps.plan.outputs.runtime_public }}
    steps:
      - name: Check out the requested main revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.OTTO_RELEASE_SOURCE }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24.21.0'
      - name: Require tested source, signing configuration and runtime integrity
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          OTTO_SIGNING_IDENTITY: ${{ vars.APPLE_SIGNING_IDENTITY }}
          OTTO_SIGNING_CERTIFICATE_SHA256: ${{ vars.APPLE_CERTIFICATE_SHA256 }}
          APPLE_CONFIGURED: ${{ secrets.APPLE_CERTIFICATE != '' && secrets.APPLE_CERTIFICATE_PASSWORD != '' && vars.APPLE_SIGNING_IDENTITY != '' && vars.APPLE_CERTIFICATE_SHA256 != '' && ((vars.OTTO_SIGNING_MODE || 'self-signed') == 'self-signed' || (secrets.APPLE_ID != '' && secrets.APPLE_APP_SPECIFIC_PASSWORD != '' && vars.APPLE_TEAM_ID != '')) }}
          OTTO_AUTOMATIC_RELEASE: ${{ inputs.automatic || false }}
        run: node .github/scripts/desktop-release.mjs plan
      - name: Save source-bound release metadata
        if: steps.plan.outputs.metadata_sha256 != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: desktop-release-plan
          path: .local/desktop-release-plan.json
          include-hidden-files: true
          retention-days: 3
          if-no-files-found: error
      - name: Save reusable Mac runtime descriptors
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: desktop-reused-runtime-descriptors
          path: .local/desktop-runtime-release
          include-hidden-files: true
          retention-days: 1
          if-no-files-found: ignore

  images:
    name: Build ${{ matrix.arch }} Mac runtime images
    needs: plan
    if: needs.plan.outputs.release_needed == 'true' && needs.plan.outputs.runtime_needed == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.runtime_matrix) }}
    runs-on: ${{ matrix.linux_runner }}
    timeout-minutes: 40
    environment:
      name: release
      deployment: false
    env:
      OTTO_DESKTOP_TARGET: ${{ matrix.platform }}
      OTTO_SIGNING_MODE: ${{ vars.OTTO_SIGNING_MODE || 'self-signed' }}
      OTTO_SIGNING_IDENTITY: ${{ vars.APPLE_SIGNING_IDENTITY }}
      OTTO_SIGNING_CERTIFICATE_SHA256: ${{ vars.APPLE_CERTIFICATE_SHA256 }}
    steps:
      - name: Check out the tested revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.plan.outputs.source }}
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24.21.0'
          cache: pnpm
      - name: Install validation dependencies
        run: pnpm install --frozen-lockfile
      - name: Set up Docker build cache
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - name: Build the workspace image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          file: Dockerfile.workspace
          platforms: linux/${{ matrix.docker_arch }}
          load: true
          tags: otto-desktop-workspace:experiment
          cache-from: type=gha,scope=desktop-workspace-${{ matrix.arch }}
          cache-to: type=gha,scope=desktop-workspace-${{ matrix.arch }},mode=max
      - name: Build the browser image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          file: Dockerfile.browser
          platforms: linux/${{ matrix.docker_arch }}
          load: true
          tags: otto-desktop-browser:experiment
          cache-from: type=gha,scope=desktop-browser-${{ matrix.arch }}
          cache-to: type=gha,scope=desktop-browser-${{ matrix.arch }},mode=max
      - name: Verify and export the native images
        run: node desktop/scripts/prepare-runtime.mjs --images-only --prebuilt-images
      - name: Transfer compressed image archives
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: desktop-runtime-images-${{ matrix.arch }}
          path: |
            .local/desktop-runtime-assets/images/*.tar.gz
            .local/desktop-runtime-assets/images-manifest.json
          include-hidden-files: true
          compression-level: 0
          retention-days: 1
          if-no-files-found: error

  runtime:
    name: Sign the ${{ matrix.arch }} Mac runtime
    needs: [plan, images]
    if: needs.plan.outputs.release_needed == 'true' && needs.plan.outputs.runtime_needed == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.runtime_matrix) }}
    runs-on: ${{ matrix.mac_runner }}
    timeout-minutes: 40
    environment:
      name: release
      deployment: false
    permissions:
      contents: write
    env:
      OTTO_SIGNING_MODE: ${{ vars.OTTO_SIGNING_MODE || 'self-signed' }}
      OTTO_SIGNING_IDENTITY: ${{ vars.APPLE_SIGNING_IDENTITY }}
      OTTO_SIGNING_CERTIFICATE_SHA256: ${{ vars.APPLE_CERTIFICATE_SHA256 }}
      OTTO_DESKTOP_TARGET: ${{ matrix.platform }}
      OTTO_RUNTIME_FINGERPRINT: ${{ matrix.runtime_fingerprint }}
      OTTO_EXPECTED_RUNTIME_FINGERPRINT: ${{ matrix.runtime_fingerprint }}
      OTTO_RUNTIME_RELEASE_TAG: desktop-v${{ needs.plan.outputs.version }}
      OTTO_RUNTIME_RELEASE_BASE_URL: ${{ (github.event_name == 'workflow_run' || inputs.publish) && matrix.runtime_public == 'true' && matrix.runtime_base_url || '' }}
    steps:
      - name: Check out the tested revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.plan.outputs.source }}
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24.21.0'
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            desktop/pnpm-lock.yaml
      - name: Install locked dependencies without signing credentials
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
        run: |
          pnpm install --frozen-lockfile
          pnpm --dir desktop install --frozen-lockfile
      - name: Download image archives
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: desktop-runtime-images-${{ matrix.arch }}
          path: .local/desktop-runtime-assets
      - name: Cache verified runtime downloads and Go compilation
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            .local/desktop-runtime-downloads
          key: desktop-host-${{ matrix.arch }}-${{ hashFiles('desktop/runtime/downloads.json', 'desktop/scripts/runtime-build-lock.json', 'desktop/scripts/build-lima.mjs', 'desktop/scripts/prepare-runtime.mjs') }}
      - name: Prepare compatible runtime host tools
        run: node desktop/scripts/prepare-runtime.mjs --host-only
      - name: Sign and package runtime binaries
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ vars.APPLE_SIGNING_IDENTITY }}
          APPLE_CERTIFICATE_SHA256: ${{ vars.APPLE_CERTIFICATE_SHA256 }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: node .github/scripts/with-apple-signing.mjs node desktop/scripts/runtime-pack.mjs --release
      - name: Save the checked runtime descriptor
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: desktop-runtime-descriptor-${{ matrix.arch }}
          path: .local/desktop-runtime-release/runtime-release.json
          include-hidden-files: true
          retention-days: 1
          if-no-files-found: error
      - name: Save the checked runtime pack
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: desktop-runtime-pack-${{ matrix.arch }}
          path: .local/desktop-runtime-release/*.tar.gz
          include-hidden-files: true
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
      - name: Clean signing material after interruption
        if: always()
        run: node .github/scripts/with-apple-signing.mjs --cleanup

  mac:
    name: Package the ${{ matrix.arch }} Mac app
    needs: [plan, images, runtime]
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.release_needed == 'true' && (needs.images.result == 'success' || needs.images.result == 'skipped') && (needs.runtime.result == 'success' || needs.runtime.result == 'skipped') }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.mac_matrix) }}
    runs-on: ${{ matrix.mac_runner }}
    timeout-minutes: 30
    environment:
      name: release
      deployment: false
    env:
      OTTO_DESKTOP_TARGET: ${{ matrix.platform }}
      OTTO_SIGNING_MODE: ${{ vars.OTTO_SIGNING_MODE || 'self-signed' }}
      OTTO_DESKTOP_VERSION: ${{ needs.plan.outputs.version }}
      OTTO_DESKTOP_UPDATE_SOURCE_URL: ${{ vars.OTTO_DESKTOP_UPDATE_SOURCE_URL }}
      OTTO_EXPECTED_RUNTIME_FINGERPRINT: ${{ matrix.runtime_fingerprint }}
      OTTO_SIGNING_IDENTITY: ${{ vars.APPLE_SIGNING_IDENTITY }}
      OTTO_SIGNING_CERTIFICATE_SHA256: ${{ vars.APPLE_CERTIFICATE_SHA256 }}
    steps:
      - name: Check out the tested revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.plan.outputs.source }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24.21.0'
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            desktop/pnpm-lock.yaml
      - name: Cache Electron download
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/Library/Caches/electron
          key: desktop-electron-${{ matrix.arch }}-${{ hashFiles('desktop/pnpm-lock.yaml') }}
      - name: Install and build without signing credentials
        run: |
          pnpm install --frozen-lockfile
          pnpm --dir desktop install --frozen-lockfile
          pnpm run build
      - name: Download the verified runtime descriptor
        if: matrix.runtime_reused != 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: desktop-runtime-descriptor-${{ matrix.arch }}
          path: .local/desktop-runtime-release
      - name: Download the reused runtime descriptors
        if: matrix.runtime_reused == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: desktop-reused-runtime-descriptors
          path: .local/reused-runtime-descriptors
      - name: Select this Mac runtime descriptor
        if: matrix.runtime_reused == 'true'
        run: |
          mkdir -p .local/desktop-runtime-release
          cp ".local/reused-runtime-descriptors/${{ matrix.arch }}/runtime-release.json" .local/desktop-runtime-release/runtime-release.json
      - name: Bind the checked runtime descriptor
        if: (github.event_name == 'workflow_run' || inputs.publish) && matrix.runtime_public == 'true' && matrix.runtime_reused != 'true'
        run: echo "OTTO_PENDING_RUNTIME_DESCRIPTOR_SHA256=$(shasum -a 256 .local/desktop-runtime-release/runtime-release.json | cut -d ' ' -f 1)" >> "$GITHUB_ENV"
      - name: Download source-bound release metadata
        if: needs.plan.outputs.metadata_sha256 != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: desktop-release-plan
          path: .local
      - name: Sign, package and verify the app
        env:
          OTTO_RELEASE_PLAN: ${{ needs.plan.outputs.metadata_sha256 && '.local/desktop-release-plan.json' || '' }}
          OTTO_RELEASE_PLAN_SHA256: ${{ needs.plan.outputs.metadata_sha256 }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ vars.APPLE_SIGNING_IDENTITY }}
          APPLE_CERTIFICATE_SHA256: ${{ vars.APPLE_CERTIFICATE_SHA256 }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: >-
          node .github/scripts/with-apple-signing.mjs
          pnpm --dir desktop run build --release
          --runtime-descriptor "$GITHUB_WORKSPACE/.local/desktop-runtime-release/runtime-release.json" --no-runtime-archive
      - name: Save the release assets
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: desktop-macos-${{ matrix.arch }}
          path: |
            dist/desktop/*.dmg
            dist/desktop/*.zip
            dist/desktop/SHA256SUMS
            dist/desktop/release.json
            dist/desktop/update.json
            dist/desktop/runtime-release.json
            dist/desktop/signing.cer
          compression-level: 0
          retention-days: 3
          if-no-files-found: error
      - name: Clean signing material after interruption
        if: always()
        run: node .github/scripts/with-apple-signing.mjs --cleanup

  windows-runtime:
    name: Build the Windows runtime
    needs: plan
    if: needs.plan.outputs.release_needed == 'true'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 60
    env:
      OTTO_DESKTOP_TARGET: win32-x64
      OTTO_RUNTIME_ASSETS: .local/windows-runtime-assets
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.plan.outputs.source }}
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24.21.0'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node desktop/scripts/prepare-windows-runtime.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: desktop-windows-runtime
          path: |
            .local/windows-runtime-assets/guest.tar.gz
            .local/windows-runtime-assets/manifest.json
          include-hidden-files: true
          compression-level: 0
          retention-days: 1
          if-no-files-found: error

  windows:
    name: Package and check the Windows installer
    needs: [plan, windows-runtime]
    runs-on: windows-2025
    timeout-minutes: 45
    env:
      OTTO_DESKTOP_VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.plan.outputs.source }}
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24.21.0'
          cache: pnpm
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.26.8'
          cache: false
      - run: |
          pnpm install --frozen-lockfile
          pnpm --dir desktop install --frozen-lockfile
          choco install nsis --yes --no-progress
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: desktop-windows-runtime
          path: .local/windows-runtime-assets
      - run: |
          pnpm run build
          node desktop/scripts/build-windows.mjs
          node desktop/scripts/check-windows.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: desktop-windows-x64
          path: |
            dist/windows/Otto-Setup-x64.exe
            dist/windows/Otto-Runtime-win32-x64.tar.gz
            dist/windows/SHA256SUMS
            dist/windows/release-win32-x64.json
            dist/windows/windows-check.json
          compression-level: 0
          retention-days: 3
          if-no-files-found: error

  release:
    name: Verify uploaded assets and prepare the release
    needs: [plan, mac, windows]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: release
    env:
      OTTO_SIGNING_MODE: ${{ vars.OTTO_SIGNING_MODE || 'self-signed' }}
      OTTO_SIGNING_IDENTITY: ${{ vars.APPLE_SIGNING_IDENTITY }}
      OTTO_SIGNING_CERTIFICATE_SHA256: ${{ vars.APPLE_CERTIFICATE_SHA256 }}
      OTTO_EXPECTED_RUNTIME_FINGERPRINT: ${{ needs.plan.outputs.runtime_fingerprint }}
      OTTO_DESKTOP_UPDATE_SOURCE_URL: ${{ vars.OTTO_DESKTOP_UPDATE_SOURCE_URL }}
      OTTO_RELEASE_PLAN: ${{ needs.plan.outputs.metadata_sha256 && '.local/desktop-release-plan.json' || '' }}
      OTTO_RELEASE_PLAN_SHA256: ${{ needs.plan.outputs.metadata_sha256 }}
    permissions:
      contents: write
    steps:
      - name: Check out the tested revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.plan.outputs.source }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24.21.0'
      - name: Download the Apple Silicon app assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: desktop-macos-arm64
          path: dist/desktop/arm64
      - name: Download the Intel app assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: desktop-macos-x64
          path: dist/desktop/x64
      - name: Download the new Apple Silicon runtime pack
        if: fromJSON(needs.plan.outputs.mac_matrix).include[0].runtime_reused != 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: desktop-runtime-pack-arm64
          path: .local/desktop-runtime-release/arm64
      - name: Download the new Intel runtime pack
        if: fromJSON(needs.plan.outputs.mac_matrix).include[1].runtime_reused != 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: desktop-runtime-pack-x64
          path: .local/desktop-runtime-release/x64
      - name: Download the Windows app assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: desktop-windows-x64
          path: dist/desktop/win32-x64
      - name: Download source-bound release metadata
        if: needs.plan.outputs.metadata_sha256 != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: desktop-release-plan
          path: .local
      - name: Verify GitHub asset digests and download the DMG and ZIP again
        env:
          GH_TOKEN: ${{ github.token }}
          OTTO_PUBLISH_RELEASE: ${{ github.event_name == 'workflow_run' || inputs.publish }}
        run: node .github/scripts/desktop-release.mjs draft-all
