name: Build desktop release

on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]
  workflow_dispatch:
    inputs:
      automatic:
        description: Select the next patch from tested main without a release metadata PR
        type: boolean
        default: false
      publish:
        description: Publish checked app and runtime drafts as preview releases
        type: boolean
        default: false

permissions:
  contents: read
  pull-requests: read

env:
  OTTO_RELEASE_SOURCE: ${{ github.event.workflow_run.head_sha || github.sha }}

concurrency:
  group: desktop-build-release
  cancel-in-progress: false
  queue: max

jobs:
  plan:
    name: Check release prerequisites
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
        (github.event.workflow_run.conclusion == 'success' &&
         github.event.workflow_run.head_repository.full_name == github.repository &&
         (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch')))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment:
      name: mac-release
      deployment: false
    env:
      OTTO_SIGNING_MODE: ${{ vars.OTTO_SIGNING_MODE || 'self-signed' }}
    permissions:
      contents: write
      actions: read
      pull-requests: read
    outputs:
      release_needed: ${{ steps.plan.outputs.release_needed }}
      metadata_sha256: ${{ steps.plan.outputs.metadata_sha256 }}
      source: ${{ steps.plan.outputs.source }}
      version: ${{ steps.plan.outputs.version }}
      previous_tag: ${{ steps.plan.outputs.previous_tag }}
      runtime_tag: ${{ steps.plan.outputs.runtime_tag }}
      runtime_fingerprint: ${{ steps.plan.outputs.runtime_fingerprint }}
      runtime_base_url: ${{ steps.plan.outputs.runtime_base_url }}
      runtime_reused: ${{ steps.plan.outputs.runtime_reused }}
      runtime_public: ${{ steps.plan.outputs.runtime_public }}
    steps:
      - name: Check out the requested main revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.OTTO_RELEASE_SOURCE }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.21.0'
      - name: Require tested source, signing configuration and runtime integrity
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          OTTO_RUNTIME_REPO: ${{ vars.OTTO_RUNTIME_REPO || github.repository }}
          OTTO_SIGNING_IDENTITY: ${{ vars.APPLE_SIGNING_IDENTITY }}
          OTTO_SIGNING_CERTIFICATE_SHA256: ${{ vars.APPLE_CERTIFICATE_SHA256 }}
          APPLE_CONFIGURED: ${{ secrets.APPLE_CERTIFICATE != '' && secrets.APPLE_CERTIFICATE_PASSWORD != '' && vars.APPLE_SIGNING_IDENTITY != '' && vars.APPLE_CERTIFICATE_SHA256 != '' && ((vars.OTTO_SIGNING_MODE || 'self-signed') == 'self-signed' || (secrets.APPLE_ID != '' && secrets.APPLE_APP_SPECIFIC_PASSWORD != '' && vars.APPLE_TEAM_ID != '')) }}
          OTTO_AUTOMATIC_RELEASE: ${{ inputs.automatic || false }}
        run: node .github/scripts/desktop-release.mjs plan
      - name: Save source-bound release metadata
        if: steps.plan.outputs.metadata_sha256 != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: desktop-release-plan
          path: .local/desktop-release-plan.json
          include-hidden-files: true
          retention-days: 3
          if-no-files-found: error
      - name: Save the reusable runtime descriptor
        if: steps.plan.outputs.runtime_reused == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: desktop-runtime-descriptor
          path: .local/desktop-runtime-release/runtime-release.json
          include-hidden-files: true
          retention-days: 1
          if-no-files-found: error

  images:
    name: Build changed runtime images on Linux ARM
    needs: plan
    if: needs.plan.outputs.release_needed == 'true' && needs.plan.outputs.runtime_reused != 'true'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 40
    environment:
      name: mac-release
      deployment: false
    env:
      OTTO_SIGNING_MODE: ${{ vars.OTTO_SIGNING_MODE || 'self-signed' }}
      OTTO_SIGNING_IDENTITY: ${{ vars.APPLE_SIGNING_IDENTITY }}
      OTTO_SIGNING_CERTIFICATE_SHA256: ${{ vars.APPLE_CERTIFICATE_SHA256 }}
    steps:
      - name: Check out the tested revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.plan.outputs.source }}
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.21.0'
          cache: pnpm
      - name: Install validation dependencies
        run: pnpm install --frozen-lockfile
      - name: Set up Docker build cache
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - name: Build the workspace image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          file: Dockerfile.workspace
          platforms: linux/arm64
          load: true
          tags: otto-desktop-workspace:experiment
          cache-from: type=gha,scope=desktop-workspace-arm64
          cache-to: type=gha,scope=desktop-workspace-arm64,mode=max
      - name: Build the browser image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          file: Dockerfile.browser
          platforms: linux/arm64
          load: true
          tags: otto-desktop-browser:experiment
          cache-from: type=gha,scope=desktop-browser-arm64
          cache-to: type=gha,scope=desktop-browser-arm64,mode=max
      - name: Verify and export the native ARM images
        run: node desktop/scripts/prepare-runtime.mjs --images-only --prebuilt-images
      - name: Transfer compressed image archives
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: desktop-runtime-images
          path: |
            .local/desktop-runtime-assets/images/*.tar.gz
            .local/desktop-runtime-assets/images-manifest.json
          include-hidden-files: true
          compression-level: 0
          retention-days: 1
          if-no-files-found: error

  runtime:
    name: Sign and prepare the runtime release
    needs: [plan, images]
    if: needs.plan.outputs.release_needed == 'true' && needs.plan.outputs.runtime_reused != 'true'
    runs-on: macos-15
    timeout-minutes: 40
    environment:
      name: mac-release
      deployment: false
    permissions:
      contents: write
    outputs:
      descriptor_sha256: ${{ steps.runtime.outputs.runtime_descriptor_sha256 }}
    env:
      OTTO_SIGNING_MODE: ${{ vars.OTTO_SIGNING_MODE || 'self-signed' }}
      OTTO_SIGNING_IDENTITY: ${{ vars.APPLE_SIGNING_IDENTITY }}
      OTTO_SIGNING_CERTIFICATE_SHA256: ${{ vars.APPLE_CERTIFICATE_SHA256 }}
      OTTO_RUNTIME_FINGERPRINT: ${{ needs.plan.outputs.runtime_fingerprint }}
      OTTO_EXPECTED_RUNTIME_FINGERPRINT: ${{ needs.plan.outputs.runtime_fingerprint }}
      OTTO_RUNTIME_RELEASE_BASE_URL: ${{ (github.event_name == 'workflow_run' || inputs.publish) && needs.plan.outputs.runtime_public == 'true' && needs.plan.outputs.runtime_base_url || '' }}
    steps:
      - name: Check out the tested revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.plan.outputs.source }}
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.21.0'
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            desktop/pnpm-lock.yaml
      - name: Install locked dependencies without signing credentials
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
        run: |
          pnpm install --frozen-lockfile
          pnpm --dir desktop install --frozen-lockfile
      - name: Download image archives
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: desktop-runtime-images
          path: .local/desktop-runtime-assets
      - name: Cache verified runtime downloads and Go compilation
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            .local/desktop-runtime-downloads
          key: desktop-host-arm64-${{ hashFiles('desktop/runtime/downloads.json', 'desktop/scripts/runtime-build-lock.json', 'desktop/scripts/build-lima.mjs', 'desktop/scripts/prepare-runtime.mjs') }}
      - name: Prepare compatible runtime host tools
        run: node desktop/scripts/prepare-runtime.mjs --host-only
      - name: Sign and package runtime binaries
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ vars.APPLE_SIGNING_IDENTITY }}
          APPLE_CERTIFICATE_SHA256: ${{ vars.APPLE_CERTIFICATE_SHA256 }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: node .github/scripts/with-apple-signing.mjs node desktop/scripts/runtime-pack.mjs --release
      - name: Upload and verify the content-addressed runtime
        id: runtime
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          OTTO_RUNTIME_REPO: ${{ vars.OTTO_RUNTIME_REPO || github.repository }}
          OTTO_PUBLISH_RELEASE: ${{ github.event_name == 'workflow_run' || inputs.publish }}
        run: node .github/scripts/desktop-release.mjs draft-runtime
      - name: Save the checked runtime descriptor
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: desktop-runtime-descriptor
          path: .local/desktop-runtime-release/runtime-release.json
          include-hidden-files: true
          retention-days: 1
          if-no-files-found: error
      - name: Clean signing material after interruption
        if: always()
        run: node .github/scripts/with-apple-signing.mjs --cleanup

  mac:
    name: Package and check the Mac app
    needs: [plan, runtime]
    if: always() && needs.plan.result == 'success' && needs.plan.outputs.release_needed == 'true' && (needs.runtime.result == 'success' || (needs.runtime.result == 'skipped' && needs.plan.outputs.runtime_reused == 'true'))
    runs-on: macos-15
    timeout-minutes: 30
    environment:
      name: mac-release
      deployment: false
    env:
      OTTO_SIGNING_MODE: ${{ vars.OTTO_SIGNING_MODE || 'self-signed' }}
      OTTO_DESKTOP_VERSION: ${{ needs.plan.outputs.version }}
      OTTO_DESKTOP_UPDATE_SOURCE_URL: ${{ vars.OTTO_DESKTOP_UPDATE_SOURCE_URL }}
      OTTO_EXPECTED_RUNTIME_FINGERPRINT: ${{ needs.plan.outputs.runtime_fingerprint }}
      OTTO_SIGNING_IDENTITY: ${{ vars.APPLE_SIGNING_IDENTITY }}
      OTTO_SIGNING_CERTIFICATE_SHA256: ${{ vars.APPLE_CERTIFICATE_SHA256 }}
    steps:
      - name: Check out the tested revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.plan.outputs.source }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.21.0'
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            desktop/pnpm-lock.yaml
      - name: Cache Electron download
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/Library/Caches/electron
          key: desktop-electron-arm64-${{ hashFiles('desktop/pnpm-lock.yaml') }}
      - name: Install and build without signing credentials
        run: |
          pnpm install --frozen-lockfile
          pnpm --dir desktop install --frozen-lockfile
          pnpm run desktop:test
          pnpm run build
      - name: Download the verified runtime descriptor
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: desktop-runtime-descriptor
          path: .local/desktop-runtime-release
      - name: Download source-bound release metadata
        if: needs.plan.outputs.metadata_sha256 != ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: desktop-release-plan
          path: .local
      - name: Sign, package and verify the app
        env:
          OTTO_RELEASE_PLAN: ${{ needs.plan.outputs.metadata_sha256 && '.local/desktop-release-plan.json' || '' }}
          OTTO_RELEASE_PLAN_SHA256: ${{ needs.plan.outputs.metadata_sha256 }}
          OTTO_PENDING_RUNTIME_DESCRIPTOR_SHA256: ${{ (github.event_name == 'workflow_run' || inputs.publish) && needs.plan.outputs.runtime_public == 'true' && needs.plan.outputs.runtime_reused != 'true' && needs.runtime.outputs.descriptor_sha256 || '' }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ vars.APPLE_SIGNING_IDENTITY }}
          APPLE_CERTIFICATE_SHA256: ${{ vars.APPLE_CERTIFICATE_SHA256 }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: >-
          node .github/scripts/with-apple-signing.mjs
          pnpm --dir desktop run build --release
          --runtime-descriptor "$GITHUB_WORKSPACE/.local/desktop-runtime-release/runtime-release.json" --no-runtime-archive
      - name: Save the release assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: desktop-macos-arm64
          path: |
            dist/desktop/*.dmg
            dist/desktop/*.zip
            dist/desktop/SHA256SUMS
            dist/desktop/release.json
            dist/desktop/update.json
            dist/desktop/runtime-release.json
            dist/desktop/signing.cer
          compression-level: 0
          retention-days: 3
          if-no-files-found: error
      - name: Clean signing material after interruption
        if: always()
        run: node .github/scripts/with-apple-signing.mjs --cleanup

  release:
    name: Verify uploaded assets and prepare the release
    needs: [plan, mac]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: mac-release
    env:
      OTTO_SIGNING_MODE: ${{ vars.OTTO_SIGNING_MODE || 'self-signed' }}
      OTTO_SIGNING_CERTIFICATE_SHA256: ${{ vars.APPLE_CERTIFICATE_SHA256 }}
      OTTO_EXPECTED_RUNTIME_FINGERPRINT: ${{ needs.plan.outputs.runtime_fingerprint }}
      OTTO_DESKTOP_UPDATE_SOURCE_URL: ${{ vars.OTTO_DESKTOP_UPDATE_SOURCE_URL }}
      OTTO_RELEASE_PLAN: ${{ needs.plan.outputs.metadata_sha256 && '.local/desktop-release-plan.json' || '' }}
      OTTO_RELEASE_PLAN_SHA256: ${{ needs.plan.outputs.metadata_sha256 }}
    permissions:
      contents: write
    steps:
      - name: Check out the tested revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.plan.outputs.source }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.21.0'
      - name: Download the checked app assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: desktop-macos-arm64
          path: dist/desktop
      - name: Download source-bound release metadata
        if: needs.plan.outputs.metadata_sha256 != ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: desktop-release-plan
          path: .local
      - name: Verify GitHub asset digests and download the DMG and ZIP again
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          OTTO_RUNTIME_REPO: ${{ vars.OTTO_RUNTIME_REPO || github.repository }}
          OTTO_PUBLISH_RELEASE: ${{ github.event_name == 'workflow_run' || inputs.publish }}
        run: node .github/scripts/desktop-release.mjs draft

  evals:
    name: Start capability evals for the published release
    needs: [plan, release]
    if: needs.plan.outputs.release_needed == 'true' && (github.event_name == 'workflow_run' || inputs.publish)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write
    steps:
      - name: Start the report on the exact published tag
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: desktop-v${{ needs.plan.outputs.version }}
          PREVIOUS_TAG: ${{ needs.plan.outputs.previous_tag }}
        run: |
          gh workflow run evals.yml --repo "$GITHUB_REPOSITORY" --ref "$RELEASE_TAG" -f baseline="$PREVIOUS_TAG"
          echo "[Capability eval reports](https://github.com/$GITHUB_REPOSITORY/actions/workflows/evals.yml)" >> "$GITHUB_STEP_SUMMARY"
