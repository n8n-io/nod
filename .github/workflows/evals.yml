name: Evals
run-name: "Evals · ${{ github.ref_name }}${{ inputs.baseline && format(' vs {0}', inputs.baseline) || '' }}"

on:
  schedule:
    - cron: '23 1 * * *'
  workflow_dispatch:
    inputs:
      baseline:
        description: Compare with this branch or tag, or latest-release, from where this branch left it (empty scores this branch alone)
        type: string
        default: ''
      tier:
        description: Scenarios to run
        type: choice
        options: [pr, full]
        default: full
      repeat:
        description: Attempts per scenario
        type: string
        default: '3'
      model:
        description: Agent model, run at high reasoning effort
        type: string
        default: openai/gpt-6.1-sol
      scenario:
        description: Only these scenarios, comma-separated (empty for the whole tier)
        type: string
        default: ''
      budget:
        description: Optional spend limit in dollars; leave empty to run all attempts
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: evals-${{ github.ref }}
  cancel-in-progress: false

jobs:
  evals:
    name: Capability evals
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: ${{ (inputs.tier || 'full') == 'full' && 360 || 90 }}
    outputs:
      verdict: ${{ steps.run.outputs.verdict }}
    env:
      TEST_DATABASE_URL: postgresql://nod:nod-evals@127.0.0.1:5432/nod_evals
      NOD_EVAL_WORKSPACE_IMAGE: nod-eval-workspace
      NOD_EVAL_BROWSER_IMAGE: nod-eval-browser
    steps:
      - name: Require the model keys
        env:
          OPENAI_API_KEY: ${{ secrets.EVALS_OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.EVALS_ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$OPENAI_API_KEY" ] || [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::error::Add the EVALS_OPENAI_API_KEY and EVALS_ANTHROPIC_API_KEY repository secrets."
            exit 1
          fi
      - name: Start a disposable PostgreSQL with room for parallel attempts
        run: >-
          docker run --detach --name evals-postgres
          --env POSTGRES_USER=nod --env POSTGRES_PASSWORD=nod-evals --env POSTGRES_DB=nod_evals
          --publish 127.0.0.1:5432:5432 postgres:17-alpine -c max_connections=300
      - name: Check out the code under test
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: ${{ inputs.baseline != '' && '0' || '1' }}
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115
      - name: Set up Node.js 24.21.0
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24.21.0'
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Set up the Docker layer cache
        uses: useblacksmith/setup-docker-builder@06dd9c83a5d541274d2e3ac67625560979275267
        with:
          cache-key: n8n-io/nod/evals
      - name: Build the workspace and browser images
        run: |
          docker buildx build --load --file Dockerfile.workspace --tag "$NOD_EVAL_WORKSPACE_IMAGE" .
          docker buildx build --load --file Dockerfile.browser --target eval --tag "$NOD_EVAL_BROWSER_IMAGE" .
      - name: Wait for PostgreSQL
        run: timeout 60 sh -c 'until docker exec evals-postgres pg_isready -h 127.0.0.1 -U nod -d nod_evals; do sleep 1; done'
      - name: Run the evals
        id: run
        env:
          OPENAI_API_KEY: ${{ secrets.EVALS_OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.EVALS_ANTHROPIC_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.EVALS_OPENROUTER_API_KEY }}
          BASELINE: ${{ inputs.baseline }}
          TIER: ${{ inputs.tier || 'full' }}
          REPEAT: ${{ inputs.repeat || '3' }}
          MODEL: ${{ inputs.model || 'openai/gpt-6.1-sol' }}
          SCENARIO: ${{ inputs.scenario }}
          BUDGET: ${{ inputs.budget }}
        shell: bash
        run: |
          set -euo pipefail
          label() { printf '%s' "$1" | tr -c 'a-zA-Z0-9.' '-' | cut -c1-40; }
          args=(--model "$MODEL" --judge anthropic/claude-sonnet-5-5 --tier "$TIER" --repeat "$REPEAT" --concurrency 4)
          if [ -n "$BUDGET" ]; then args+=(--budget "$BUDGET"); fi
          if [ -n "$SCENARIO" ]; then args+=(--scenario "$SCENARIO"); fi
          candidate="$(label "$GITHUB_REF_NAME")-$(git rev-parse --short=7 HEAD)"
          echo "candidate=$candidate" >> "$GITHUB_OUTPUT"
          base=""
          if [ -n "$BASELINE" ]; then
            if [ "$BASELINE" = latest-release ]; then
              BASELINE="$(git describe --tags --abbrev=0 --match 'nod-v*' HEAD^ 2>/dev/null || true)"
              if [ -z "$BASELINE" ]; then
                echo "::notice::There is no earlier desktop release, so this commit is scored alone."
              fi
            fi
          fi
          if [ -n "$BASELINE" ]; then
            case "$BASELINE" in -*) echo "::error::The baseline must be a branch or tag."; exit 1 ;; esac
            git rev-parse --verify --quiet "$BASELINE^{commit}" >/dev/null || BASELINE="origin/$BASELINE"
            base="$(git merge-base HEAD "$BASELINE")"
            if [ "$base" = "$(git rev-parse HEAD)" ]; then
              echo "::notice::This commit is already in $BASELINE, so there is nothing to compare."
              base=""
            fi
          fi
          if [ -z "$base" ]; then
            echo "verdict=INCONCLUSIVE" >> "$GITHUB_OUTPUT"
            pnpm run eval:capability run "${args[@]}" --label "$candidate"
            exit 0
          fi
          ref="$(git rev-parse --short=7 "$base")"
          if [ "$base" = "$(git rev-parse "$BASELINE^{commit}")" ]; then ref="$BASELINE"; fi
          mkdir -p .local/capability-evals
          if git diff --quiet "$base" HEAD -- src ':(exclude)src/web' package.json pnpm-lock.yaml pnpm-workspace.yaml; then
            printf '### GO against %s\n\nNothing the evals exercise changed, so nothing was run.\n' "$ref" > ".local/capability-evals/$candidate-gate.md"
            echo "verdict=GO" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          pnpm run eval:capability gate "${args[@]}" --baseline "$ref" --label "$candidate"
          echo "verdict=$(node -p "require('./.local/capability-evals/$candidate-gate.json').verdict")" >> "$GITHUB_OUTPUT"
      - name: Save the reports
        id: upload
        if: always() && steps.run.outputs.candidate != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: capability-evals
          path: |
            .local/capability-evals/
            !.local/capability-evals/*/logs/
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: error
      - name: Show the results
        if: always() && steps.run.outputs.candidate != ''
        env:
          CANDIDATE: ${{ steps.run.outputs.candidate }}
          REPORT_URL: ${{ steps.upload.outputs.artifact-url }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -f ".local/capability-evals/$CANDIDATE-gate.md" ]; then
            report="$(cat ".local/capability-evals/$CANDIDATE-gate.md")"
          else
            report="$(node --import tsx evals/src/cli.ts markdown "$CANDIDATE")"
          fi
          echo "::notice title=Capability evals::$(sed -n '1s/^### //p' <<< "$report")"
          printf '%s\n' "$report"
          {
            printf '%s\n\n' "$report"
            if [ -n "$REPORT_URL" ]; then
              echo "Transcripts, checks and diagnoses: [capability-evals]($REPORT_URL) (open report.html in each run)"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
