name: Desktop update acceptance

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-update-acceptance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-updates:
    name: Signed ${{ matrix.arch }} update and profile preservation
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
          - arch: x64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
      - name: Set up Node.js 24.21.0
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.21.0'
          cache: pnpm
          cache-dependency-path: desktop/pnpm-lock.yaml
      - name: Install locked desktop dependencies
        run: pnpm --dir desktop install --frozen-lockfile
      - name: Verify native installation and signature rejection with synthetic profiles
        run: node desktop/scripts/check-native-updates.mjs
      - name: Clean signing material after interruption
        if: always()
        run: node .github/scripts/with-apple-signing.mjs --cleanup
      - name: Save acceptance receipts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: native-update-acceptance-${{ matrix.arch }}
          path: .local/native-update-acceptance/*.json
          if-no-files-found: error
          retention-days: 7
