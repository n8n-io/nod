name: Dependabot auto-merge

on:
  pull_request_target:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review]

permissions: {}

concurrency:
  group: dependabot-auto-merge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  auto-merge:
    if: >-
      github.repository == 'n8n-io/nod' &&
      github.actor == 'dependabot[bot]' &&
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.commits == 1 &&
      !github.event.pull_request.draft
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      actions: write
      checks: read
      contents: write
      pull-requests: write
    steps:
      - name: Read verified Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98
        with:
          github-token: ${{ github.token }}
      - name: Merge compatible updates after required checks pass
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          DEPENDENCIES: ${{ steps.metadata.outputs.updated-dependencies-json }}
        shell: bash
        run: |
          set -euo pipefail
          if ! jq -e '
            length > 0 and all(.[];
              .packageEcosystem != "github_actions" and
              (.updateType == "version-update:semver-patch" or .updateType == "version-update:semver-minor") and
              (.packageEcosystem != "npm_and_yarn" or
                ((.prevVersion | test("^v?[1-9][0-9]*\\.[0-9]+\\.[0-9]+$")) and
                 (.newVersion | test("^v?[1-9][0-9]*\\.[0-9]+\\.[0-9]+$"))))
            )
          ' <<< "$DEPENDENCIES" > /dev/null; then
            echo "This update needs manual review."
            exit 0
          fi
          ready=false
          for ((attempt = 0; attempt < 12; attempt++)); do
            ready=$(gh pr view "$PR_URL" --json statusCheckRollup --jq '
              [.statusCheckRollup[] | .name // .context] |
                index("Checks, tests and build") != null and index("Secret scanning") != null
            ')
            if [[ "$ready" == true ]]; then break; fi
            sleep 10
          done
          if [[ "$ready" != true ]]; then
            echo "Required CI checks have not started."
            exit 1
          fi
          gh pr checks "$PR_URL" --required --watch --fail-fast --interval 30
          gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/commits" |
            jq -e --arg sha "$HEAD_SHA" '
              length == 1 and .[0].sha == $sha and
              .[0].author.login == "dependabot[bot]" and
              .[0].commit.verification.verified == true
            ' > /dev/null
          gh api --method POST "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/reviews" \
            -f event=APPROVE -f commit_id="$HEAD_SHA" > /dev/null
          gh pr merge "$PR_URL" --squash --match-head-commit "$HEAD_SHA"
          test "$(gh pr view "$PR_URL" --json mergedAt --jq '.mergedAt != null')" = true
          gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref main
