name: Release desktop

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to release; leave empty for the next patch
        type: string
        required: false
      highlights:
        description: 'Public Markdown highlights. For multiple lines, use gh workflow run --field highlights=@file. See Desktop releases in the docs.'
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: prepare-desktop-release
  cancel-in-progress: false

jobs:
  prepare:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - name: Check out release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24.21.0'
      - name: Prepare versions and changelog
        id: version
        env:
          NOD_RELEASE_VERSION: ${{ inputs.version }}
          NOD_RELEASE_HIGHLIGHTS: ${{ inputs.highlights }}
          NOD_RELEASE_NOTES_FILE: ${{ runner.temp }}/release-notes.md
        run: node .github/scripts/prepare-desktop-release.mjs
      - name: Prepare the release PR description
        run: |
          cat > "$RUNNER_TEMP/release-pr.md" <<'TEXT'
          The coding agent that prepares the release should try to create a video with the feature-video skill, including for releases that contain only fixes. If it meets the skill's quality standard, attach the MP4 here and record its URL with node .github/scripts/prepare-desktop-release.mjs --video URL. If the video fails quality checks or cannot be made or uploaded, leave video as null, explain the reason here without private content, and continue with text notes. A video failure does not block the release. Review the result, then mark this PR ready. Follow https://nod.n8n.io/docs/contribute/desktop-releases/#make-the-release-video.

          Merge this PR after review and CI. CI on the merge commit builds Mac Intel, Mac ARM, Windows x64 and Linux x64 packages. It checks all four bundles and publishes one regular Nod GitHub release. Linux is a Flatpak preview. Its bundle includes the runtime and arrives in numbered parts with checksums.

          If main changes before merge, run Release desktop again to update this PR.

          Review the public highlights below before merge. Keep them short, specific, and playful. Follow https://nod.n8n.io/docs/contribute/desktop-releases/#write-release-highlights. The publisher uses this copy and puts the full changelog and build details in a collapsed section.

          TEXT
          cat "$RUNNER_TEMP/release-notes.md" >> "$RUNNER_TEMP/release-pr.md"
      - name: Open or update the release PR
        id: pr
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1
        with:
          branch: release/desktop
          draft: always-true
          base: main
          title: 'chore(release): Nod desktop ${{ steps.version.outputs.version }}'
          commit-message: 'chore(release): Nod desktop ${{ steps.version.outputs.version }}'
          body-path: ${{ runner.temp }}/release-pr.md
          add-paths: |
            desktop/package.json
            desktop/release.json
            desktop/CHANGELOG.md
      - name: Run CI for the bot-created release branch
        if: steps.pr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.pr.outputs.pull-request-number }}
        run: |
          gh workflow run ci.yml --ref release/desktop
          gh workflow run pr-title.yml --ref release/desktop -f pull_request="$PR_NUMBER"
