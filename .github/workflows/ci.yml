name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: true

jobs:
  scope:
    name: Select checks for changed files
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 5
    outputs:
      core: ${{ steps.scope.outputs.core }}
      desktop: ${{ steps.scope.outputs.desktop }}
      n8n: ${{ steps.scope.outputs.n8n }}
      cloudflare: ${{ steps.scope.outputs.cloudflare }}
      evals: ${{ steps.scope.outputs.evals }}
      images: ${{ steps.scope.outputs.images }}
      network: ${{ steps.scope.outputs.network }}
      e2b: ${{ steps.scope.outputs.e2b }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24.21.0'
      - name: Read the changed paths
        id: scope
        env:
          CI_DIFF_BASE: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
        run: node .github/scripts/ci-scope.mjs

  checks:
    name: Checks, tests and build
    needs: scope
    if: ${{ !cancelled() }}
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 45
    services:
      postgres:
        image: ${{ needs.scope.outputs.core == 'true' && 'postgres:17-alpine' || '' }}
        env:
          POSTGRES_USER: otto
          POSTGRES_PASSWORD: otto-ci
          POSTGRES_DB: otto_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U otto -d otto_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      CI: 'true'
      TEST_DATABASE_URL: postgresql://otto:otto-ci@127.0.0.1:5432/otto_ci
    steps:
      - name: Require a valid change scope
        env:
          CI_SCOPE_RESULT: ${{ needs.scope.result }}
        run: test "$CI_SCOPE_RESULT" = success
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
      - name: Set up Node.js 24.21.0
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24.21.0'
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            desktop/pnpm-lock.yaml
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Check the release version and source
        if: >-
          (github.event_name == 'pull_request' &&
           github.head_ref == 'release/desktop' &&
           github.event.pull_request.head.repo.full_name == github.repository) ||
          github.ref == 'refs/heads/release/desktop'
        run: node .github/scripts/prepare-desktop-release.mjs --check
      - name: Install desktop build tooling without downloading Electron
        if: needs.scope.outputs.desktop == 'true'
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
        run: pnpm --dir desktop install --frozen-lockfile
      - name: Check desktop lifecycle, storage and release contracts
        if: needs.scope.outputs.desktop == 'true'
        run: pnpm run desktop:test
      - name: Check n8n delivery contracts
        if: needs.scope.outputs.n8n == 'true'
        run: node --test deployment/n8n/*.test.mjs
      - name: Check desktop network isolation during restart
        if: needs.scope.outputs.network == 'true'
        run: >-
          sudo env OTTO_TEST_RUNTIME_NETWORK=1 "$(command -v node)"
          --test --test-name-pattern='workload firewall refresh'
          desktop/test/runtime-assets.test.mjs
      - name: Check types, boundaries and formatting
        if: needs.scope.outputs.core == 'true'
        run: pnpm run check
      - name: Check formatting without a full type check
        if: needs.scope.outputs.core != 'true'
        run: pnpm run format:check
      - name: Build the client
        if: needs.scope.outputs.core == 'true' || needs.scope.outputs.cloudflare == 'true' || needs.scope.outputs.images == 'true'
        run: pnpm run build
      - name: Install Cloudflare adapter dependencies
        if: needs.scope.outputs.cloudflare == 'true'
        run: pnpm --dir deployment/cloudflare install --frozen-lockfile
      - name: Check Cloudflare adapter types and fixtures
        if: needs.scope.outputs.cloudflare == 'true'
        run: |
          pnpm --dir deployment/cloudflare run check
          pnpm --dir deployment/cloudflare test
      - name: Check the capability eval harness
        if: needs.scope.outputs.evals == 'true'
        run: |
          pnpm --dir evals run check
          pnpm --dir evals test
      - name: Validate both Cloudflare deployment bundles
        if: needs.scope.outputs.cloudflare == 'true'
        working-directory: deployment/cloudflare
        env:
          WRANGLER_SEND_METRICS: 'false'
        run: |
          pnpm exec wrangler deploy --env development --dry-run --containers-rollout=none
          pnpm exec wrangler deploy --env production --dry-run --containers-rollout=none
      - name: Set up the Docker layer cache
        if: needs.scope.outputs.images == 'true'
        uses: useblacksmith/setup-docker-builder@19215110ab936351210feebdfa5b440b4493e184
        with:
          cache-key: n8n-io/otto/ci
      - name: Build the runtime and separate computer images
        if: needs.scope.outputs.images == 'true'
        run: |
          docker buildx build --load --platform linux/amd64 --file deployment/cloudflare/Dockerfile --tag otto-ci .
          docker buildx build --load --platform linux/amd64 --file deployment/cloudflare/Dockerfile.browser --tag otto-ci-browser .
          docker buildx build --load --platform linux/amd64 --file deployment/cloudflare/Dockerfile.workspace --tag otto-ci-workspace .
          docker buildx build --load --platform linux/amd64 --file Dockerfile.browser --tag otto-ci-local-browser .
      - name: Verify the shared local and desktop browser image
        if: needs.scope.outputs.images == 'true'
        run: node --import tsx desktop/scripts/check-browser-image.mjs otto-ci-local-browser
      - name: Verify automatic RTK savings and unfiltered exports
        if: needs.scope.outputs.images == 'true'
        run: node --import tsx scripts/eval-rtk.ts --smoke --image otto-ci-workspace
      - name: Run all integration tests with PostgreSQL and Chromium
        if: needs.scope.outputs.core == 'true'
        run: >-
          docker run --rm --network host --shm-size=1g
          --env TEST_DATABASE_URL
          --env OTTO_TEST_NATIVE_DOWNLOAD=true
          --env OTTO_TEST_BROWSER_EXECUTABLE=/usr/bin/chromium
          --volume "$PWD/src:/app/src:ro"
          --volume "$PWD/tests:/app/tests:ro"
          --volume "$PWD/scripts:/app/scripts:ro"
          --volume "$PWD/public:/app/public:ro"
          --volume "$PWD/deployment/e2b:/app/deployment/e2b:ro"
          --volume "$PWD/desktop/ui:/app/desktop/ui:ro"
          --volume "$PWD/tsconfig.json:/app/tsconfig.json:ro"
          --volume "$PWD/dist/web:/app/dist/web:ro"
          --tmpfs /app/.local:uid=1000,gid=1000
          --entrypoint /usr/bin/tini otto-ci-browser
          -- node scripts/test-integration.mjs --run
      - name: Verify the runtime filesystem and user
        if: needs.scope.outputs.images == 'true'
        run: >-
          docker run --rm --network none --entrypoint node otto-ci
          -e 'const fs=require("node:fs");if(process.getuid()===0||fs.existsSync("/app/.env")||fs.existsSync("/app/.local")||!fs.existsSync("/app/dist/web/index.html"))process.exit(1)'
      - name: Verify computer image boundaries, readiness and graceful shutdown
        if: needs.scope.outputs.images == 'true'
        shell: bash
        run: |
          set -euo pipefail
          for role in browser workspace; do
            docker run --rm --interactive --network none --entrypoint node "otto-ci-$role" --input-type=module - "$role" <<'JS'
          import assert from 'node:assert/strict';
          import { spawnSync } from 'node:child_process';
          import { constants, existsSync, accessSync, lstatSync, readlinkSync, writeFileSync, unlinkSync } from 'node:fs';
          const role = process.argv[2];
          assert.equal(process.getuid(), 1000);
          assert.equal(process.arch, 'x64');
          assert.deepEqual(Object.keys(process.env).filter((key) => /OTTO_|OPENAI|ANTHROPIC|COMPOSIO|DATABASE|SECRET|TOKEN|API_KEY|E2B|GOOGLE|BETTER_AUTH|GATEWAY_ENV/.test(key)), []);
          for (const path of ['/app/.env', '/app/.local', '/app/src/server', '/data/control.sock', '/var/run/docker.sock']) assert.equal(existsSync(path), false);
          const helpers = ['entrypoint.mjs', 'checkpoint.py', ...(role === 'workspace' ? ['workspace-command.py'] : [])];
          for (const name of helpers) {
            const path = `/opt/otto/${name}`;
            const stat = lstatSync(path);
            assert.equal(stat.isFile(), true);
            assert.equal(stat.uid, 0);
            assert.equal(stat.mode & 0o222, 0);
            assert.throws(() => accessSync(path, constants.W_OK));
          }
          assert.equal(lstatSync('/opt/otto').mode & 0o222, 0);
          accessSync('/usr/bin/tini', constants.X_OK);
          accessSync('/usr/bin/python3', constants.X_OK);
          const python = spawnSync('/usr/bin/python3', ['-c', 'import ast,sys; [ast.parse(open(path).read()) for path in sys.argv[1:]]', ...helpers.filter((name) => name.endsWith('.py')).map((name) => `/opt/otto/${name}`)], { stdio: 'ignore' });
          assert.equal(python.status, 0);
          if (role === 'browser') {
            accessSync('/usr/bin/chromium', constants.X_OK);
            accessSync('/app/node_modules/agent-browser/bin/agent-browser-linux-x64', constants.X_OK);
            accessSync('/app/src/providers/container-browser/worker.ts', constants.R_OK);
            accessSync('/app/src/providers/container-browser/bridge.ts', constants.R_OK);
          } else {
            const command = spawnSync('python', ['-c', 'assert 123456 * 789 == 97406784'], { stdio: 'ignore' });
            assert.equal(command.status, 0);
            assert.equal(existsSync('/usr/bin/chromium'), false);
            assert.equal(existsSync('/app'), false);
            assert.equal(existsSync('/home/node/state'), false);
            assert.equal(readlinkSync('/workspace'), '/home/node/state/workspace');
            assert.equal(readlinkSync('/home/node/.local'), '/home/node/state/tools');
          }
          for (const directory of role === 'browser' ? ['/data'] : ['/home/node']) {
            const path = `${directory}/synthetic-ci-check`;
            writeFileSync(path, 'synthetic');
            unlinkSync(path);
          }
          JS
            container="otto-ci-$role-health"
            trap 'docker rm --force "$container" >/dev/null 2>&1 || true' EXIT
            docker run --detach --name "$container" --network none "otto-ci-$role"
            docker exec "$container" node --input-type=module -e '
              import assert from "node:assert/strict";
              import { existsSync, readFileSync } from "node:fs";
              import { setTimeout } from "node:timers/promises";
              assert.equal(readFileSync("/proc/1/comm", "utf8").trim(), "tini");
              let ready = false;
              for (let attempt = 0; attempt < 60; attempt++) {
                ready = await fetch("http://127.0.0.1:4311/health", { signal: AbortSignal.timeout(1000) }).then((response) => response.status === 200).catch(() => false);
                if (ready) break;
                await setTimeout(500);
              }
              assert.equal(ready, true);
              if (!existsSync("/app")) assert.equal(existsSync("/home/node/state"), false);
              assert.equal((await fetch("http://127.0.0.1:4311/")).status, 404);
              assert.equal((await fetch("http://127.0.0.1:4311/health", { method: "POST" })).status, 404);
            '
            docker stop -t 15 "$container"
            test "$(docker inspect --format '{{.State.ExitCode}}' "$container")" = 0
            test -z "$(docker logs "$container" 2>&1)"
            docker rm "$container"
            trap - EXIT
          done

  e2b-computer:
    name: Combined E2B computer isolation
    needs: scope
    if: needs.scope.outputs.e2b == 'true'
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
      - name: Set up Node.js 24.21.0
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24.21.0'
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Set up the Docker layer cache
        uses: useblacksmith/setup-docker-builder@19215110ab936351210feebdfa5b440b4493e184
        with:
          cache-key: n8n-io/otto/ci-e2b
      - name: Build and verify the combined computer image
        shell: bash
        run: |
          set -euo pipefail
          node --import tsx deployment/e2b/build-local.ts | tee "$RUNNER_TEMP/otto-e2b-build.log"
          image="$(tail -n 1 "$RUNNER_TEMP/otto-e2b-build.log" | node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const { image } = JSON.parse(readFileSync(0, "utf8"));
            if (typeof image !== "string" || !/^otto-e2b-computer:[a-f0-9]{12}$/.test(image)) throw new Error("The combined computer image is invalid.");
            process.stdout.write(image);
          ')"
          node deployment/e2b/validate-computer.mjs "$image"

  secrets:
    name: Secret scanning
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 10
    steps:
      - name: Check out complete history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install verified Gitleaks 8.30.1
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/gitleaks"
          cd "$RUNNER_TEMP/gitleaks"
          curl --fail --location --retry 3 --output gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          printf '%s  %s\n' '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb' 'gitleaks.tar.gz' | sha256sum --check --status
          tar --extract --gzip --file gitleaks.tar.gz gitleaks
      - name: Verify scanning exceptions still detect secrets
        run: python3 .github/scripts/check-secret-config.py "$RUNNER_TEMP/gitleaks/gitleaks"
      - name: Scan Git history
        run: '"$RUNNER_TEMP/gitleaks/gitleaks" git --redact --no-banner --verbose --log-opts=HEAD .'
      - name: Scan the checked-out files
        run: '"$RUNNER_TEMP/gitleaks/gitleaks" dir --redact --no-banner --verbose .'
