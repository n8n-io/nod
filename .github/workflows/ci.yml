name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
    types: [checks_requested]
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'schedule' && 'scheduled' || (github.ref == 'refs/heads/main' && github.sha || github.ref) }}
  cancel-in-progress: true

jobs:
  notes:
    name: Delete Git notes
    needs: checks
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Delete every notes ref on GitHub
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/notes/" --jq '.[].ref' |
            while read -r ref; do
              gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/$ref"
              echo "Deleted $ref"
            done

  checks:
    name: Checks, tests and build
    runs-on: blacksmith-16vcpu-ubuntu-2404
    timeout-minutes: 15
    outputs:
      types: ${{ steps.scope.outputs.types }}
      build: ${{ steps.scope.outputs.build }}
      integration: ${{ steps.scope.outputs.integration }}
      desktop: ${{ steps.scope.outputs.desktop }}
      macos: ${{ steps.scope.outputs.macos }}
      windows: ${{ steps.scope.outputs.windows }}
      n8n: ${{ steps.scope.outputs.n8n }}
      evals: ${{ steps.scope.outputs.evals }}
      images: ${{ steps.scope.outputs.images }}
      network: ${{ steps.scope.outputs.network }}
      ci: ${{ steps.scope.outputs.ci }}
      test_files: ${{ steps.scope.outputs.test_files }}
      desktop_test_files: ${{ steps.scope.outputs.desktop_test_files }}
      quality_checks: ${{ steps.scope.outputs.quality_checks }}
      format_files: ${{ steps.scope.outputs.format_files }}
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: nod
          POSTGRES_PASSWORD: nod-ci
          POSTGRES_DB: nod_ci
          POSTGRES_INITDB_ARGS: --set fsync=off --set synchronous_commit=off --set full_page_writes=off --set max_connections=300
        ports:
          - 5432:5432
        options: >-
          --tmpfs /var/lib/postgresql/data
          --health-cmd "pg_isready -h 127.0.0.1 -U nod -d nod_ci"
          --health-interval 1s
          --health-timeout 5s
          --health-retries 30
    env:
      CI: 'true'
      TEST_DATABASE_URL: postgresql://nod:nod-ci@127.0.0.1:5432/nod_ci
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: ${{ (github.head_ref == 'release/desktop' || github.ref == 'refs/heads/release/desktop') && '0' || '2' }}
          persist-credentials: false
      - name: Install tooling and dependencies once
        uses: ./.github/actions/setup-node
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: .local/ci-test-timings
          key: ci-test-timings-v2-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ci-test-timings-v2-
            ci-test-timings-v1-
      - name: Select tests with the installed tools
        id: scope
        env:
          CI_DIFF_BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before || '' }}
          CI_TEST_TIMINGS: .local/ci-test-timings
        run: node .github/scripts/ci-scope.mjs
      - name: Require valid check selection
        shell: node {0}
        env:
          CI_SCOPE_RESULT: ${{ steps.scope.outcome }}
          CI_SCOPE: ${{ toJSON(steps.scope.outputs) }}
        run: |
          if (process.env.CI_SCOPE_RESULT !== 'success')
            throw new Error('CI could not select the required checks.');
          const scope = JSON.parse(process.env.CI_SCOPE);
          for (const name of ['types', 'build', 'integration', 'desktop', 'macos', 'windows', 'n8n', 'evals', 'images', 'network', 'ci']) {
            if (!['true', 'false'].includes(scope[name]))
              throw new Error(`The ${name} scope is missing or invalid.`);
          }
      - name: Prepare the browser fixture without building an image
        if: steps.scope.outputs.integration == 'true'
        shell: bash
        run: |
          missing=()
          for program in Xvfb xauth; do
            command -v "$program" >/dev/null || missing+=("${program,,}")
          done
          if (( ${#missing[@]} )); then
            sudo apt-get update -qq
            sudo apt-get install --yes --no-install-recommends "${missing[@]}"
          fi
          chrome="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium)"
          if [[ "$chrome" != /usr/bin/chromium ]]; then
            sudo ln -sf "$chrome" /usr/bin/chromium
          fi
          sudo ln -s "$PWD" /app
          mkdir -p "$RUNNER_TEMP/integration-timings"
      - name: Install desktop tooling without downloading Electron
        if: steps.scope.outputs.desktop == 'true'
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
        run: pnpm --dir desktop install --frozen-lockfile
      - name: Run checks in parallel with shared setup
        shell: bash
        env:
          NOD_FORMAT_FILES: ${{ steps.scope.outputs.format_files }}
          NOD_CHECK_LINT: ${{ contains(fromJSON(steps.scope.outputs.quality_checks), 'lint') }}
          NOD_CHECK_TYPES: ${{ steps.scope.outputs.types }}
          NOD_CHECK_BUILD: ${{ steps.scope.outputs.build }}
          NOD_CHECK_INTEGRATION: ${{ steps.scope.outputs.integration }}
          NOD_CHECK_DESKTOP: ${{ steps.scope.outputs.desktop }}
          NOD_CHECK_EVALS: ${{ steps.scope.outputs.evals }}
          NOD_CHECK_N8N: ${{ steps.scope.outputs.n8n }}
          NOD_CHECK_NETWORK: ${{ steps.scope.outputs.network }}
          NOD_TEST_FILES: ${{ steps.scope.outputs.test_files }}
          NOD_DESKTOP_TEST_FILES: ${{ steps.scope.outputs.desktop_test_files }}
          NOD_TEST_TIMINGS: ${{ runner.temp }}/integration-timings/1.json
          NOD_TEST_NATIVE_DOWNLOAD: 'true'
          NOD_TEST_BROWSER_EXECUTABLE: /usr/bin/chromium
          NOD_DESKTOP_RELEASE_ACCEPTANCE: ${{ github.event_name != 'pull_request' && github.event_name != 'merge_group' }}
        run: |
          pids=()
          (node --test .github/scripts/ci-scope.test.mjs && node .github/scripts/ci-scope.mjs --format) &
          pids+=("$!")
          pnpm run check:apps &
          pids+=("$!")
          if [[ "$NOD_CHECK_LINT" == true ]]; then
            pnpm run lint &
            pids+=("$!")
          fi
          if [[ "$NOD_CHECK_TYPES" == true ]]; then
            pnpm run typecheck &
            pids+=("$!")
          fi
          if [[ "$NOD_CHECK_BUILD" == true || "$NOD_CHECK_INTEGRATION" == true ]]; then
            (pnpm exec vite build && node desktop/scripts/build-ui.mjs &&
              if [[ "$NOD_CHECK_INTEGRATION" == true ]]; then node scripts/test-integration.mjs --run; fi) &
            pids+=("$!")
          fi
          if [[ "$NOD_CHECK_DESKTOP" == true ]]; then
            node .github/scripts/ci-scope.mjs --desktop-tests &
            pids+=("$!")
          fi
          if [[ "$NOD_CHECK_EVALS" == true ]]; then
            (pnpm --dir evals run check && pnpm --dir evals test) &
            pids+=("$!")
          fi
          if [[ "$NOD_CHECK_N8N" == true ]]; then
            node --test deployment/n8n/*.test.mjs &
            pids+=("$!")
          fi
          if [[ "$NOD_CHECK_NETWORK" == true ]]; then
            sudo env NOD_TEST_RUNTIME_NETWORK=1 "$(command -v node)" --test --test-name-pattern='workload firewall refresh' desktop/test/runtime-assets.test.mjs &
            pids+=("$!")
          fi
          status=0
          for pid in "${pids[@]}"; do
            wait "$pid" || status=1
          done
          exit "$status"
      - name: Check the release version and source
        if: >-
          (github.event_name == 'pull_request' && github.head_ref == 'release/desktop' &&
          github.event.pull_request.head.repo.full_name == github.repository) ||
          github.ref == 'refs/heads/release/desktop'
        run: node .github/scripts/prepare-desktop-release.mjs --check
      - name: Check workflow syntax and expressions
        if: steps.scope.outputs.ci == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/actionlint"
          gh release download v1.7.12 --repo rhysd/actionlint --pattern actionlint_1.7.12_linux_amd64.tar.gz --output "$RUNNER_TEMP/actionlint.tar.gz"
          printf '%s  %s\n' '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8' "$RUNNER_TEMP/actionlint.tar.gz" | sha256sum --check --status
          tar --extract --gzip --file "$RUNNER_TEMP/actionlint.tar.gz" --directory "$RUNNER_TEMP/actionlint" actionlint
          "$RUNNER_TEMP/actionlint/actionlint" -shellcheck= -pyflakes= -ignore 'label "blacksmith-.*" is unknown' -ignore 'unexpected key "queue" for "concurrency" section'
      - name: Save test file times
        if: always() && steps.scope.outputs.integration == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: integration-timings-1
          path: ${{ runner.temp }}/integration-timings/*.json
          if-no-files-found: ignore
          retention-days: 7
      - name: Merge test file times
        if: success() && steps.scope.outputs.integration == 'true'
        env:
          CI_TEST_TIMINGS: .local/ci-test-timings
          CI_NEW_TEST_TIMINGS: ${{ runner.temp }}/integration-timings
        run: node .github/scripts/ci-tests.mjs
      - name: Cache test times for later runs
        if: success() && steps.scope.outputs.integration == 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: .local/ci-test-timings
          key: ci-test-timings-v2-${{ github.run_id }}-${{ github.run_attempt }}

  images:
    name: Container and self-host checks
    needs: checks
    if: needs.checks.outputs.images == 'true'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install tooling and dependencies
        uses: ./.github/actions/setup-node
      - name: Set up the Docker layer cache
        uses: useblacksmith/setup-docker-builder@9657a6e02ca6445e6d6ce5ffaf370f4828dea50d
        with:
          cache-key: n8n-io/nod/ci
      - name: Build the browser, workspace and server images
        run: |
          docker buildx build --load --platform linux/amd64 --file Dockerfile.browser --tag nod-ci-browser .
          docker buildx build --load --platform linux/amd64 --file Dockerfile.workspace --tag nod-ci-workspace .
          docker buildx build --load --platform linux/amd64 --file deployment/self-host/Dockerfile --tag nod-server:ci .
          docker tag nod-ci-browser nod-browser:ci
          docker tag nod-ci-workspace nod-workspace:ci
      - name: Check workspace egress and command recovery in the workspace image
        if: needs.checks.outputs.images == 'true'
        env:
          NOD_TEST_WORKSPACE_IMAGE: nod-ci-workspace
        run: pnpm exec tsx --test --test-name-pattern='workspace egress|fully detached' tests/sandbox.test.ts
      - name: Verify the single-user server deployment and token rotation
        env:
          NOD_IMAGE_TAG: ci
        run: node deployment/self-host/check.mjs
      - name: Verify the shared local and desktop browser image
        run: node --import tsx desktop/scripts/check-browser-image.mjs nod-ci-browser
      - name: Verify automatic RTK savings and unfiltered exports
        run: node --import tsx scripts/eval-rtk.ts --smoke --image nod-ci-workspace

  macos:
    name: macOS native identity and updates (${{ matrix.arch }})
    needs: checks
    if: needs.checks.outputs.macos == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            arch: arm64
          - os: macos-15-intel
            arch: x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    env:
      CI: 'true'
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install tooling and dependencies
        uses: ./.github/actions/setup-node
        with:
          cache-dependency-path: |
            pnpm-lock.yaml
            desktop/pnpm-lock.yaml
      - name: Install Electron and desktop tooling
        run: pnpm --dir desktop install --frozen-lockfile
      - name: Verify native updates and identity preservation
        run: node desktop/scripts/check-native-updates.mjs
      - name: Preserve native acceptance report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: macos-native-acceptance-${{ matrix.arch }}
          path: .local/native-update-acceptance/*.json
          include-hidden-files: true
          if-no-files-found: ignore

  windows:
    name: Windows setup and installer
    needs: checks
    if: needs.checks.outputs.windows == 'true'
    runs-on: windows-2025
    timeout-minutes: 35
    env:
      CI: 'true'
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install tooling and dependencies
        uses: ./.github/actions/setup-node
        with:
          cache-dependency-path: |
            pnpm-lock.yaml
            desktop/pnpm-lock.yaml
      - name: Install Electron and desktop tooling
        run: pnpm --dir desktop install --frozen-lockfile
      - name: Download the Electron binary before the tests
        env:
          GH_TOKEN: ${{ github.token }}
        run: node desktop/scripts/prepare-windows-electron.mjs
      - name: Install NSIS for native update acceptance
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
        run: choco install nsis --yes --no-progress
      - name: Check Windows credential storage across Electron restarts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force .local/windows-setup | Out-Null
          node --test --test-name-pattern="Windows DPAPI" `
            --test-reporter=spec --test-reporter-destination=stdout `
            --test-reporter=junit --test-reporter-destination=.local/windows-setup/desktop.xml `
            desktop/test/settings.test.mjs
      - name: Check Windows browser app sign-in bridge
        shell: pwsh
        run: |
          $edge = @(
            (Join-Path ${env:ProgramFiles(x86)} 'Microsoft\Edge\Application\msedge.exe')
            (Join-Path $env:ProgramFiles 'Microsoft\Edge\Application\msedge.exe')
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $edge) { throw 'Microsoft Edge is required for the native app sign-in test.' }
          $version = (Get-Item $edge).VersionInfo.FileVersion
          $facts = @{ browserVersion = if ($version -match '^\d{1,3}(\.\d{1,6}){1,3}$') { $version } else { 'unknown' } }
          foreach ($hive in @('HKLM', 'HKCU')) {
            foreach ($name in @('RemoteDebuggingAllowed', 'DeveloperToolsAvailability', 'HeadlessModeEnabled')) {
              $key = "${hive}:\SOFTWARE\Policies\Microsoft\Edge"
              $facts["$hive.$name"] = try {
                $value = Get-ItemPropertyValue -Path $key -Name $name -ErrorAction Stop
                if ($value -in @(0, 1, 2)) { [int]$value } else { 'other' }
              } catch { 'unavailable' }
            }
            foreach ($name in @('DeveloperToolsAvailabilityAllowlist', 'DeveloperToolsAvailabilityBlocklist')) {
              $facts["$hive.$name"] = try {
                $count = (Get-Item -Path "${hive}:\SOFTWARE\Policies\Microsoft\Edge\$name" -ErrorAction Stop).Property.Count
                [Math]::Min($count, 1024)
              } catch { 'unavailable' }
            }
          }
          $facts | ConvertTo-Json -Compress
          $env:NOD_TEST_BROWSER_EXECUTABLE = $edge
          node --import tsx --test --test-name-pattern="native browser completes the local app sign-in bridge" `
            --test-reporter=spec --test-reporter-destination=stdout `
            --test-reporter=junit --test-reporter-destination=.local/windows-setup/bridge.xml `
            tests/integrations.test.ts
      - name: Check local file rules on Windows
        run: pnpm exec tsx --test --test-name-pattern="local file rules" tests/sandbox.test.ts
      - name: Execute the PowerShell installer fixtures
        shell: pwsh
        run: >-
          node --test
          --test-reporter=spec --test-reporter-destination=stdout
          --test-reporter=junit --test-reporter-destination=.local/windows-setup/installer.xml
          --test-name-pattern="CLI-INSTALL: (the Windows script|Windows refuses)"
          deployment/n8n/install.test.mjs
      - name: Verify native Windows updates and profile preservation
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
        run: node desktop/scripts/check-windows-updates.mjs
      - name: Preserve Windows test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: windows-setup-reports
          path: |
            .local/windows-setup/*.xml
            .local/windows-update-acceptance/*.json
          include-hidden-files: true
          if-no-files-found: ignore

  secrets:
    name: Secret scanning
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 10
    steps:
      - name: Check out complete history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install verified Gitleaks 8.30.1
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/gitleaks"
          cd "$RUNNER_TEMP/gitleaks"
          gh release download v8.30.1 --repo gitleaks/gitleaks --pattern gitleaks_8.30.1_linux_x64.tar.gz --output gitleaks.tar.gz
          printf '%s  %s\n' '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb' 'gitleaks.tar.gz' | sha256sum --check --status
          tar --extract --gzip --file gitleaks.tar.gz gitleaks
      - name: Verify scanning exceptions still detect secrets
        run: python3 .github/scripts/check-secret-config.py "$RUNNER_TEMP/gitleaks/gitleaks"
      - name: Scan Git history
        run: '"$RUNNER_TEMP/gitleaks/gitleaks" git --config .gitleaks.toml --redact --no-banner --verbose --log-opts=--all .'
      - name: Scan the checked-out files
        run: '"$RUNNER_TEMP/gitleaks/gitleaks" dir --config .gitleaks.toml --redact --no-banner --verbose .'
