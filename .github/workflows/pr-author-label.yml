name: PR author label

on:
  pull_request_target:
    types: [opened, reopened]

permissions: {}

jobs:
  team:
    name: Label n8n team PRs
    if: >-
      github.repository == 'n8n-io/nod' &&
      contains(fromJSON('["MEMBER","OWNER"]'), github.event.pull_request.author_association)
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions:
      issues: write
      pull-requests: write
    steps:
      - name: Add the n8n team label
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          gh label create "n8n team" --color ffffff --description "Authored by the n8n team" --force
          gh api --method POST "repos/$GH_REPO/issues/$PR_NUMBER/labels" -f "labels[]=n8n team" --silent
