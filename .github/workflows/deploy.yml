name: Deploy production

on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: otto-production-deploy
  cancel-in-progress: false

jobs:
  gate:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      approved: ${{ steps.revision.outputs.approved }}
      sha: ${{ steps.revision.outputs.sha }}
    steps:
      - name: Require the tested revision to remain the current main branch
        id: revision
        env:
          GH_TOKEN: ${{ github.token }}
          TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$TESTED_SHA" =~ ^[a-f0-9]{40}$ ]]; then exit 1; fi
          current_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
          if [[ "$TESTED_SHA" == "$current_sha" ]]; then
            echo "approved=true" >> "$GITHUB_OUTPUT"
            echo "sha=$TESTED_SHA" >> "$GITHUB_OUTPUT"
          else
            echo "approved=false" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    needs: gate
    if: needs.gate.outputs.approved == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment:
      name: production
      url: ${{ vars.OTTO_PUBLIC_URL }}
    env:
      CI: 'true'
      WRANGLER_SEND_METRICS: 'false'
      OTTO_RELEASE: ${{ needs.gate.outputs.sha }}
    steps:
      - name: Check out the exact revision that passed CI
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.gate.outputs.sha }}
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
      - name: Set up Node.js 24.21.0
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.21.0'
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            deployment/cloudflare/pnpm-lock.yaml
      - name: Install locked dependencies without production secrets
        run: |
          pnpm install --frozen-lockfile
          pnpm --dir deployment/cloudflare install --frozen-lockfile
      - name: Check and rebuild the release
        run: |
          pnpm run check
          pnpm run build
          pnpm --dir deployment/cloudflare run check
          pnpm --dir deployment/cloudflare test
      - name: Build the verified runtime and computer images
        run: |
          docker build --platform linux/amd64 --build-arg "OTTO_RELEASE=$OTTO_RELEASE" --file deployment/cloudflare/Dockerfile --tag "otto-production:$OTTO_RELEASE" .
          docker build --platform linux/amd64 --file deployment/cloudflare/Dockerfile.browser --tag "otto-production-browser:$OTTO_RELEASE" .
          docker build --platform linux/amd64 --file deployment/cloudflare/Dockerfile.workspace --tag "otto-production-workspace:$OTTO_RELEASE" .
      - name: Publish images, deploy code and secrets together, and verify production
        env:
          GH_TOKEN: ${{ github.token }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GATEWAY_ENV: ${{ secrets.GATEWAY_ENV }}
          OTTO_PUBLIC_URL: ${{ vars.OTTO_PUBLIC_URL }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$OTTO_RELEASE" =~ ^[a-f0-9]{40}$ ]]; then exit 1; fi
          current_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
          if [[ "$OTTO_RELEASE" != "$current_sha" ]]; then
            echo "Skipping a release superseded on main."
            exit 0
          fi
          unset GH_TOKEN
          node deployment/cloudflare/scripts/deploy.mjs production
