regexes = [
    '''^\s*"projectKeySha256":\s*"6442d4beb807e9c95ccbea7f14a7c7ce7bcddda33d813d4a778eaf2fffc378d5",?$''',
    '''^\s*"projectKeySha256":\s*"848838a37e984d8edb9d1aad6bc37f695fe1bcb4049ebedfc38c78ac21b86069",?$''',
