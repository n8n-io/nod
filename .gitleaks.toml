title = "Nod secret scanning"

[extend]
useDefault = true

[[rules]]
id = "composio-api-key"
description = "Composio project or user API key."
regex = '''\bu?ak_[A-Za-z0-9_-]{16,}'''
entropy = 3
keywords = ["ak_"]

[[rules]]
id = "e2b-api-key"
description = "E2B API key."
regex = '''\be2b_[A-Za-z0-9]{20,}'''
entropy = 3
keywords = ["e2b_"]

[[allowlists]]
description = "This exact SQL match captures the waiting_reason field name, not a credential."
targetRules = ["generic-api-key"]
regexTarget = "match"
regexes = ["^waiting_credentials',waiting_reason='$"]

[[allowlists]]
description = "The public PostHog ingestion token is intentionally bundled with the client."
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['^src/shared/analytics\.ts$', '^src/shared/posthog-host\.json$', '^deployment/n8n/desktop-releases\.mjs$']
regexTarget = "secret"
regexes = ['^phc_tLmmvBasQMKWVJ2BiwhEzVVDD3Rh9qDq2VTmw3qTm6EV$']

[[allowlists]]
description = "Tests, fixtures and eval worlds hold synthetic values. Only the keyword and entropy rule is skipped there; provider key formats still fail."
targetRules = ["generic-api-key"]
paths = [
    '(^|/)tests?/',
    '(^|/)fixtures?/',
    '[._]test\.[a-z]+$',
    '^evals/src/(scenarios|world)/',
]

[[allowlists]]
description = "Exact evidence fingerprints verified against their frozen source or synthetic inputs."
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['^docs/testing/composio\-proxy/cp03\.v2\.inputs\.json$']
regexTarget = "line"
regexes = [
    '''^\s*"src/providers/environment/key\-store\.ts":\s*"f24292271eeb16e17fa57da9d16990ad318eee5ed4a6b4c29b8077df819ba951",?$''',
]

[[allowlists]]
description = "Exact evidence fingerprints verified against their frozen source or synthetic inputs."
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['^docs/testing/composio\-proxy/cp03\.v2\.results\.json$']
