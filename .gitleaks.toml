title = "Otto secret scanning"

[extend]
useDefault = true

[[allowlists]]
description = "This exact SQL match captures the waiting_reason field name, not a credential."
targetRules = ["generic-api-key"]
regexTarget = "match"
regexes = ["^waiting_credentials',waiting_reason='$"]

[[allowlists]]
description = "The public PostHog ingestion token is intentionally bundled with the client."
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['^src/shared/analytics\.ts$']
regexTarget = "secret"
regexes = ['^phc_tLmmvBasQMKWVJ2BiwhEzVVDD3Rh9qDq2VTmw3qTm6EV$']

[[allowlists]]
description = "App acceptance evidence records each source file's SHA-256 under its repository path; check-secret-config.py verifies every such hash against the file at the evidence commit."
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['^docs/research/apps-acceptance-[0-9a-f]+\.json$']
regexTarget = "line"
regexes = ['^\s*"((?:src|evals|tests|scripts|deployment|desktop)/[A-Za-z0-9_./-]+\.(?:ts|tsx|mts|mjs|js|py|sh|css|md|json))": "([0-9a-f]{64})",?$']
